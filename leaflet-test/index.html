<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leaflet Test · AutoBoard Fase 1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="./leaflet-map.css?v=20260928c">
</head>
<body>

<div id="hud">
  <span>Motor: <b>Leaflet</b> · <span id="ver">(js antiguo)</span></span>
  <span class="sp"></span>
  <span id="spd">0 km/h</span>
  <span id="acc">— m</span>
  <span id="fps">— fps</span>
</div>

<div id="map"></div>
<div id="hud2wrap"><canvas id="hud2canvas"></canvas></div>
<div id="tabs">
  <button id="tabMapa" class="modo on">🗺️ Mapa</button>
  <button id="tabHud" class="modo">🚗 HUD</button>
  <button id="tabFaro" class="modo">💡 Faro</button>
</div>
<div id="hud2err"></div>
<div id="radaredge"></div>
<div class="radarsign" id="radarsign"><div class="rs-c"><span id="rsmax">80</span></div><div class="rs-d" id="rsdist">500 m</div></div>
<div id="navbanner">
  <div class="arrow" id="navarrow"></div>
  <div class="navtext"><div class="navd" id="navd"></div><div class="navsub" id="navsub"></div></div>
  <button class="navx" id="cancelRuta">✕</button>
</div>
<div id="status">Leaflet real + MapTiler (token) — sin ningún adaptador de por medio</div>

<button id="searchToggle">🔍</button>
<div id="spdmap"><b id="spd2">0</b><small>KM/H</small></div>
<div id="bar">
  <div class="searchrow">
    <button id="homeBtn" title="Casa (mantén pulsado para fijar)">🏠</button>
    <input id="q" type="text" placeholder="¿A dónde vamos?" autocomplete="off">
    <button id="go">Ir</button>
  </div>
  <div class="suggest" id="suggest"></div>
</div>

<!-- Tres iconos abajo a la derecha, mismo sitio y orden que AutoBoard real -->
<button id="recenter" class="ovl">🎯</button>
<button id="sat" class="ovl">🛰️</button>
<button id="gear" class="ovl">⚙️</button>

<div id="settings">
  <div class="shead"><span>Ajustes</span><button id="closeSettings">✕</button></div>
  <button class="setbtn" id="mapnight">🌙 Noche</button>
  <button class="setbtn" id="trafficBtn">🚦 Tráfico</button>
  <button class="setbtn" id="rotateBtn">🧭 Girar mapa (a prueba)</button>
  <div class="srow" style="margin-top:16px">
    <span>Favoritos</span>
    <div id="favList"></div>
    <div class="favrow" id="addFavBtn" style="color:#5fd0e0">⭐ Guardar destino actual como favorito</div>
  </div>
  <div class="srow">
    <span>Últimas direcciones</span>
    <div id="recentList"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- leaflet-rotate: experimental, a prueba. Si el archivo no carga o el
     metodo que necesita no existe, el ajuste de "girar mapa" simplemente
     no hace nada -- no hay ningun sitio del codigo que dependa de que esto
     funcione para lo demas. -->
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script src="./leaflet-map.js?v=20260928c"></script>
<script>if(/[?&]debug=1/.test(location.search)){var e=document.createElement("script");e.src="https://cdn.jsdelivr.net/npm/eruda";e.onload=function(){eruda.init()};document.head.appendChild(e);}</script>
</body>
</html>
