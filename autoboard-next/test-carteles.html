<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test carteles — corregido</title>
<style>
body{margin:0;padding:20px;background:#1a1d22;color:#e8eef2;font:14px/1.5 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:16px;color:#9ae6b4;margin:32px 0 12px;border-bottom:1px solid #2a3138;padding-bottom:6px}
p.intro{color:#8d99a5;margin:0 0 24px}
.grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.celda{display:flex;flex-direction:column;align-items:center;gap:6px}
.etiqueta{font-size:12px;color:#ffd166;font-weight:700}
.etiqueta .num{color:#fff;background:#2a3138;border-radius:4px;padding:1px 6px;margin-right:4px}
svg{display:block}
.nota{font-size:11px;color:#8d99a5;text-align:center;max-width:200px}
</style>
</head>
<body>
<h1>Test de carteles — corregido</h1>
<p class="intro">Puntas al borde exacto. Variante E corregida. Bug del 302 arreglado. Sin flecha grande a la derecha en carriles.</p>

<h2>1. Vía normal</h2>
<div class="grid" id="sec1"></div>

<h2>2. Autopista</h2>
<div class="grid" id="sec2"></div>

<h2>3. Rotondas</h2>
<div class="grid" id="sec3"></div>

<h2>4. Carteles con carriles</h2>
<div class="grid" id="sec4"></div>

<h2>5. Variantes de flecha</h2>
<div class="grid" id="sec5"></div>

<script>
// ---------- Paletas ----------
function paletaNormal(){ return {fondo:'#ffffff', borde:'#000000', flecha:'#000000', flechaInactiva:'#bbbbbb'}; }
function paletaAutopista(){ return {fondo:'#1e4a8a', borde:'#ffffff', flecha:'#ffffff', flechaInactiva:'#7fb0e8'}; }

// ============================================================================
// GEOMETRÍA DE FLECHAS
// Cada variante define, por maniobra:
//   - punto final del trazo (donde empieza la base del triángulo)
//   - vértice real de la punta
//   - ángulo de la punta (radianes, 0 = arriba)
// El path termina en la BASE de la punta, no en el vértice.
// ============================================================================

// --- Utilidad: dado el vértice y el ángulo, devuelve la base (retrocediendo LEN) ---
function baseDePunta(vx, vy, ang, len){
  return {
    x: vx - Math.sin(ang)*len,
    y: vy + Math.cos(ang)*len
  };
}

// --- Flecha genérica estilo B (ángulo recto duro, como Tesla) ---
// La construimos aquí directamente con los dos puntos, sin regex ni recortes.
function dibujarFlechaB(mod, colores, grosor, tamPunta){
  const LEN = tamPunta;
  const HW  = tamPunta * 0.75;
  let d = '';       // path del trazo
  let vx, vy, ang;  // vértice de la punta

  // Definimos el vértice y la "forma" del trazo hasta la base.
  // Truco: dibujamos el trazo con la misma forma pero terminando en la base.
  switch(mod){
    case 'straight':
      vx = 24; vy = 12; ang = 0;
      d = 'M24 44 L24 ' + (vy + LEN);
      break;
    case 'slight right':
      vx = 40; vy = 14; ang = Math.PI/2;
      d = 'M24 44 L24 18 L' + (vx - LEN) + ' 14';
      break;
    case 'slight left':
      vx = 8; vy = 14; ang = -Math.PI/2;
      d = 'M24 44 L24 18 L' + (vx + LEN) + ' 14';
      break;
    case 'right':
      vx = 40; vy = 12; ang = Math.PI/2;
      d = 'M24 44 L24 12 L' + (vx - LEN) + ' 12';
      break;
    case 'left':
      vx = 8; vy = 12; ang = -Math.PI/2;
      d = 'M24 44 L24 12 L' + (vx + LEN) + ' 12';
      break;
    case 'sharp right':
      vx = 40; vy = 34; ang = Math.PI;
      d = 'M24 44 L24 20 L40 20 L40 ' + (vy - LEN);
      break;
    case 'sharp left':
      vx = 8; vy = 34; ang = Math.PI;
      d = 'M24 44 L24 20 L8 20 L8 ' + (vy - LEN);
      break;
    case 'uturn':
      vx = 44; vy = 32; ang = Math.PI;
      d = 'M24 44 L24 8 L44 8 L44 ' + (vy - LEN);
      break;
    default:
      vx = 24; vy = 12; ang = 0;
      d = 'M24 44 L24 ' + (vy + LEN);
  }

  // Triángulo de la punta
  const tan = {x: Math.sin(ang), y: -Math.cos(ang)};
  const lat = {x: Math.cos(ang), y: Math.sin(ang)};
  const bx = vx - tan.x*LEN;
  const by = vy - tan.y*LEN;
  const l = {x: bx + lat.x*HW, y: by + lat.y*HW};
  const r = {x: bx - lat.x*HW, y: by - lat.y*HW};
  const tri = 'M'+vx+' '+vy+' L'+l.x.toFixed(1)+' '+l.y.toFixed(1)+' L'+r.x.toFixed(1)+' '+r.y.toFixed(1)+' Z';

  return '<path d="'+d+'" stroke="'+colores.flecha+'" stroke-width="'+grosor+'" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>'
       + '<path d="'+tri+'" fill="'+colores.flecha+'"/>';
}

// --- Variante E (Google Maps): curvas suaves, también termina en la base ---
function dibujarFlechaE(mod, colores, grosor, tamPunta){
  const LEN = tamPunta;
  const HW  = tamPunta * 0.75;
  let d = '', vx, vy, ang;

  switch(mod){
    case 'straight':
      vx = 24; vy = 12; ang = 0;
      d = 'M24 44 L24 ' + (vy + LEN);
      break;
    case 'slight right':
      vx = 40; vy = 12; ang = Math.PI/2;
      d = 'M24 44 L24 24 Q24 12 36 12 L' + (vx - LEN) + ' 12';
      break;
    case 'slight left':
      vx = 8; vy = 12; ang = -Math.PI/2;
      d = 'M24 44 L24 24 Q24 12 12 12 L' + (vx + LEN) + ' 12';
      break;
    case 'right':
      vx = 40; vy = 10; ang = Math.PI/2;
      d = 'M24 44 L24 20 Q24 10 34 10 L' + (vx - LEN) + ' 10';
      break;
    case 'left':
      vx = 8; vy = 10; ang = -Math.PI/2;
      d = 'M24 44 L24 20 Q24 10 14 10 L' + (vx + LEN) + ' 10';
      break;
    case 'sharp right':
      vx = 40; vy = 34; ang = Math.PI;
      d = 'M24 44 L24 30 Q24 22 32 22 Q40 22 40 30 L40 ' + (vy - LEN);
      break;
    case 'sharp left':
      vx = 8; vy = 34; ang = Math.PI;
      d = 'M24 44 L24 30 Q24 22 16 22 Q8 22 8 30 L8 ' + (vy - LEN);
      break;
    case 'uturn':
      vx = 44; vy = 32; ang = Math.PI;
      d = 'M24 44 L24 20 Q24 6 34 6 Q44 6 44 20 L44 ' + (vy - LEN);
      break;
    default:
      vx = 24; vy = 12; ang = 0;
      d = 'M24 44 L24 ' + (vy + LEN);
  }

  const tan = {x: Math.sin(ang), y: -Math.cos(ang)};
  const lat = {x: Math.cos(ang), y: Math.sin(ang)};
  const bx = vx - tan.x*LEN;
  const by = vy - tan.y*LEN;
  const l = {x: bx + lat.x*HW, y: by + lat.y*HW};
  const r = {x: bx - lat.x*HW, y: by - lat.y*HW};
  const tri = 'M'+vx+' '+vy+' L'+l.x.toFixed(1)+' '+l.y.toFixed(1)+' L'+r.x.toFixed(1)+' '+r.y.toFixed(1)+' Z';

  return '<path d="'+d+'" stroke="'+colores.flecha+'" stroke-width="'+grosor+'" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>'
       + '<path d="'+tri+'" fill="'+colores.flecha+'"/>';
}

// --- Variante A (curva suave original) ---
function dibujarFlechaA(mod, colores, grosor, tamPunta){
  const LEN = tamPunta;
  const HW  = tamPunta * 0.75;
  let d = '', vx, vy, ang;
  switch(mod){
    case 'straight':
      vx = 24; vy = 14; ang = 0;
      d = 'M24 44 L24 ' + (vy + LEN);
      break;
    case 'slight right':
      vx = 40; vy = 14; ang = Math.PI/2;
      d = 'M24 44 L24 26 Q24 14 34 14 L' + (vx - LEN) + ' 14';
      break;
    case 'slight left':
      vx = 8; vy = 14; ang = -Math.PI/2;
      d = 'M24 44 L24 26 Q24 14 14 14 L' + (vx + LEN) + ' 14';
      break;
    case 'right':
      vx = 40; vy = 12; ang = Math.PI/2;
      d = 'M24 44 L24 22 Q24 12 34 12 L' + (vx - LEN) + ' 12';
      break;
    case 'left':
      vx = 8; vy = 12; ang = -Math.PI/2;
      d = 'M24 44 L24 22 Q24 12 14 12 L' + (vx + LEN) + ' 12';
      break;
    case 'sharp right':
      vx = 40; vy = 34; ang = Math.PI;
      d = 'M24 44 L24 28 Q24 20 32 20 Q40 20 40 28 L40 ' + (vy - LEN);
      break;
    case 'sharp left':
      vx = 8; vy = 34; ang = Math.PI;
      d = 'M24 44 L24 28 Q24 20 16 20 Q8 20 8 28 L8 ' + (vy - LEN);
      break;
    case 'uturn':
      vx = 44; vy = 32; ang = Math.PI;
      d = 'M24 44 L24 20 Q24 8 34 8 Q44 8 44 20 L44 ' + (vy - LEN);
      break;
    default:
      vx = 24; vy = 14; ang = 0;
      d = 'M24 44 L24 ' + (vy + LEN);
  }
  const tan = {x: Math.sin(ang), y: -Math.cos(ang)};
  const lat = {x: Math.cos(ang), y: Math.sin(ang)};
  const bx = vx - tan.x*LEN, by = vy - tan.y*LEN;
  const l = {x: bx + lat.x*HW, y: by + lat.y*HW};
  const r = {x: bx - lat.x*HW, y: by - lat.y*HW};
  const tri = 'M'+vx+' '+vy+' L'+l.x.toFixed(1)+' '+l.y.toFixed(1)+' L'+r.x.toFixed(1)+' '+r.y.toFixed(1)+' Z';
  return '<path d="'+d+'" stroke="'+colores.flecha+'" stroke-width="'+grosor+'" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>'
       + '<path d="'+tri+'" fill="'+colores.flecha+'"/>';
}

// --- Dispatcher por variante ---
const VARIANTES = {
  A: {fn: dibujarFlechaA, grosor:6.5, tamPunta:10, nota:'Curva suave original'},
  B: {fn: dibujarFlechaB, grosor:7,   tamPunta:11, nota:'Ángulo recto duro (Tesla)'},
  D: {fn: dibujarFlechaB, grosor:9,   tamPunta:13, nota:'Trazo grueso'},
  E: {fn: dibujarFlechaE, grosor:6.5, tamPunta:10, nota:'Google Maps — punta al borde'}
};

// ---------- Cartel simple ----------
function cartel(variante, mod, paleta){
  const v = VARIANTES[variante];
  const colores = paleta();
  const ancho = 120, alto = 120, radio = 16;
  let svg = '<svg viewBox="0 0 '+ancho+' '+alto+'" width="'+ancho+'" height="'+alto+'">';
  svg += '<rect x="3" y="3" width="'+(ancho-6)+'" height="'+(alto-6)+'" rx="'+radio+'" ry="'+radio+'" fill="'+colores.fondo+'" stroke="'+colores.borde+'" stroke-width="4"/>';
  svg += '<g transform="translate('+(ancho/2-36)+','+(alto/2-36)+') scale(1.5)">';
  svg += v.fn(mod, colores, v.grosor, v.tamPunta);
  svg += '</g></svg>';
  return svg;
}

// ---------- Rotonda ----------
function roundaboutSVG(exit, colores){
  const r = 12, grosor = 5;
  const exitReal = Math.max(1, parseInt(exit,10) || 1);
  const col = colores.flecha;
  let s = '<g transform="translate(24,26)">';
  s += '<circle cx="0" cy="0" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+grosor+'" opacity="0.9"/>';
  s += '<path d="M0 24 L0 '+r+'" stroke="'+col+'" stroke-width="'+grosor+'" stroke-linecap="round"/>';
  const NEXITS = 3, pasoDeg = 360/NEXITS, a0 = -Math.PI/2;
  for(let k=0;k<NEXITS;k++){
    const a = a0 + (k*pasoDeg)*Math.PI/180;
    const x1 = Math.cos(a)*r, y1 = Math.sin(a)*r;
    const x2 = Math.cos(a)*(r+7), y2 = Math.sin(a)*(r+7);
    const esElegida = (k === Math.min(exitReal-1, NEXITS-1));
    s += '<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' L'+x2.toFixed(1)+' '+y2.toFixed(1)+'" stroke="'+(esElegida?'#ffb020':col)+'" stroke-width="'+(esElegida?5:3)+'" stroke-linecap="round"/>';
  }
  s += '<text x="0" y="5" text-anchor="middle" font-size="14" font-weight="800" fill="'+col+'" font-family="system-ui,sans-serif">'+exitReal+'</text>';
  s += '</g>';
  return s;
}
function cartelRotonda(exit, paleta){
  const colores = paleta();
  const ancho = 120, alto = 120, radio = 16;
  let svg = '<svg viewBox="0 0 '+ancho+' '+alto+'" width="'+ancho+'" height="'+alto+'">';
  svg += '<rect x="3" y="3" width="'+(ancho-6)+'" height="'+(alto-6)+'" rx="'+radio+'" ry="'+radio+'" fill="'+colores.fondo+'" stroke="'+colores.borde+'" stroke-width="4"/>';
  svg += '<g transform="translate('+(ancho/2-24)+','+(alto/2-30)+') scale(1.5)">';
  svg += roundaboutSVG(exit, colores);
  svg += '</g></svg>';
  return svg;
}

// ---------- Flecha de carril (soporta varias direcciones) ----------
function flechaCarril(dirs, activo, colores, x, y){
  const color = activo ? colores.flecha : colores.flechaInactiva;
  const cy = y + 24;
  const lista = Array.isArray(dirs) && dirs.length ? dirs : ['straight'];
  let out = '';
  lista.forEach((dir, i) => {
    // Si hay 2 direcciones, la primera se desplaza a la izquierda y la segunda a la derecha.
    const offset = lista.length > 1 ? (i === 0 ? -5 : 5) : 0;
    const xx = x + offset;
    const escala = lista.length > 1 ? 0.8 : 1;
    const g = 3.2 * escala;
    const len = 6 * escala;
    const hw  = 4.5 * escala;

    let d = '', vx, vy, ang;
    if(dir === 'straight'){ vx = xx; vy = y+6; ang = 0; d = 'M'+xx+' '+cy+' L'+xx+' '+(vy+len); }
    else if(dir === 'right'){ vx = xx+8; vy = y+6; ang = Math.PI/2; d = 'M'+xx+' '+cy+' L'+xx+' '+(y+14)+' Q'+xx+' '+(y+6)+' '+(vx-len)+' '+(y+6); }
    else if(dir === 'left'){ vx = xx-8; vy = y+6; ang = -Math.PI/2; d = 'M'+xx+' '+cy+' L'+xx+' '+(y+14)+' Q'+xx+' '+(y+6)+' '+(vx+len)+' '+(y+6); }
    else if(dir === 'slight right'){ vx = xx+6; vy = y+6; ang = Math.PI/4; d = 'M'+xx+' '+cy+' L'+xx+' '+(y+12)+' Q'+xx+' '+(y+6)+' '+(vx-len*0.7)+' '+(y+6); }
    else if(dir === 'slight left'){ vx = xx-6; vy = y+6; ang = -Math.PI/4; d = 'M'+xx+' '+cy+' L'+xx+' '+(y+12)+' Q'+xx+' '+(y+6)+' '+(vx+len*0.7)+' '+(y+6); }
    else if(dir === 'uturn'){ vx = xx+14; vy = y+14; ang = Math.PI; d = 'M'+xx+' '+cy+' L'+xx+' '+(y+12)+' Q'+xx+' '+(y+4)+' '+(xx+8)+' '+(y+4)+' Q'+(xx+14)+' '+(y+4)+' '+(vx)+' '+(vy-len); }
    else { vx = xx; vy = y+6; ang = 0; d = 'M'+xx+' '+cy+' L'+xx+' '+(vy+len); }

    const tan = {x: Math.sin(ang), y: -Math.cos(ang)};
    const lat = {x: Math.cos(ang), y: Math.sin(ang)};
    const bx = vx - tan.x*len, by = vy - tan.y*len;
    const l = {x: bx + lat.x*hw, y: by + lat.y*hw};
    const r = {x: bx - lat.x*hw, y: by - lat.y*hw};
    const tri = 'M'+vx.toFixed(1)+' '+vy.toFixed(1)+' L'+l.x.toFixed(1)+' '+l.y.toFixed(1)+' L'+r.x.toFixed(1)+' '+r.y.toFixed(1)+' Z';

    out += '<path d="'+d+'" stroke="'+color+'" stroke-width="'+g+'" stroke-linecap="butt" stroke-linejoin="round" fill="none"/>'
         + '<path d="'+tri+'" fill="'+color+'"/>';
  });
  return out;
}

// ---------- Cartel con carriles (SIN flecha grande a la derecha) ----------
function cartelCarriles(lanes, paleta){
  const colores = paleta();
  const n = lanes.length;
  const anchoCarril = 40;
  const padding = 10;
  const anchoTotal = padding + n*anchoCarril + padding;
  const alto = 120, radio = 16;
  let svg = '<svg viewBox="0 0 '+anchoTotal+' '+alto+'" width="'+anchoTotal+'" height="'+alto+'">';
  svg += '<rect x="3" y="3" width="'+(anchoTotal-6)+'" height="'+(alto-6)+'" rx="'+radio+'" ry="'+radio+'" fill="'+colores.fondo+'" stroke="'+colores.borde+'" stroke-width="4"/>';
  for(let i=0;i<n;i++){
    const carril = lanes[i];
    const dirs = (carril.lane && carril.lane.directions) || ['straight'];
    const activo = !!(carril.lane && carril.lane.active);
    const cx = padding + anchoCarril*i + anchoCarril/2;
    svg += flechaCarril(dirs, activo, colores, cx, 34);
    if(i < n-1){
      const sx = padding + anchoCarril*(i+1);
      svg += '<line x1="'+sx+'" y1="18" x2="'+sx+'" y2="'+(alto-18)+'" stroke="'+colores.borde+'" stroke-width="1" opacity="0.25"/>';
    }
  }
  svg += '</svg>';
  return svg;
}

// ============================================================================
// PINTADO
// ============================================================================
const maniobras = [
  ['straight','Sigue recto'],
  ['slight right','Ligero derecha'],
  ['right','Derecha'],
  ['sharp right','Cerrado derecha'],
  ['slight left','Ligero izquierda'],
  ['left','Izquierda'],
  ['sharp left','Cerrado izquierda'],
  ['uturn','Cambio sentido']
];

function pintarSeccion(id, paleta, variante, numBase){
  const cont = document.getElementById(id);
  let num = numBase;
  maniobras.forEach(m => {
    const div = document.createElement('div');
    div.className = 'celda';
    div.innerHTML = cartel(variante, m[0], paleta)
      + '<div class="etiqueta"><span class="num">#'+num+'</span>'+m[1]+'</div>';
    cont.appendChild(div);
    num++;
  });
}

pintarSeccion('sec1', paletaNormal,   'B', 1);
pintarSeccion('sec2', paletaAutopista, 'B', 101);

// Rotondas
{
  const cont = document.getElementById('sec3');
  for(let i=1;i<=3;i++){
    const div = document.createElement('div');
    div.className = 'celda';
    div.innerHTML = cartelRotonda(i, paletaNormal)
      + '<div class="etiqueta"><span class="num">#'+(200+i)+'</span>Rotonda salida '+i+'</div>';
    cont.appendChild(div);
  }
}

// Carriles — el 302 ahora con los DOS carriles derechos activos
{
  const cont = document.getElementById('sec4');
  const ejemplos = [
    [{lane:{directions:['left'],active:false}},{lane:{directions:['straight'],active:true}},{lane:{directions:['right'],active:false}}],
    [{lane:{directions:['left'],active:false}},{lane:{directions:['right'],active:true}},{lane:{directions:['right'],active:true}}],
    [{lane:{directions:['left'],active:false}},{lane:{directions:['straight','right'],active:true}},{lane:{directions:['straight','right'],active:true}},{lane:{directions:['right'],active:false}}],
    [{lane:{directions:['left'],active:true}},{lane:{directions:['left','straight'],active:true}},{lane:{directions:['straight'],active:false}},{lane:{directions:['right'],active:false}}]
  ];
  const nombres = ['301 — 3 carriles, recto','302 — 3 carriles, derecha (2 activos)','303 — 4 carriles, dos activos','304 — 4 carriles mixto'];
  ejemplos.forEach((ej, idx) => {
    const div = document.createElement('div');
    div.className = 'celda';
    div.innerHTML = cartelCarriles(ej, paletaNormal)
      + '<div class="etiqueta"><span class="num">#'+(301+idx)+'</span>'+nombres[idx].split('—')[1].trim()+'</div>';
    cont.appendChild(div);
  });
}

// Variantes de flecha (todas con la punta al borde ya)
{
  const cont = document.getElementById('sec5');
  ['A','B','D','E'].forEach((id, idx) => {
    const div = document.createElement('div');
    div.className = 'celda';
    div.innerHTML = cartel(id, 'right', paletaNormal)
      + '<div class="etiqueta"><span class="num">#'+(401+idx)+'</span>Variante '+id+'</div>'
      + '<div class="nota">'+VARIANTES[id].nota+'</div>';
    cont.appendChild(div);
  });
}
</script>
