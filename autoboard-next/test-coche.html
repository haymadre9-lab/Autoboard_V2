<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Test coche 3D</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0e12;overflow:hidden}
  #map{position:absolute;inset:0}
  #estado{position:fixed;top:10px;left:10px;z-index:10;background:rgba(10,13,16,.88);
    border:1px solid #232c33;border-radius:10px;padding:10px 14px;color:#e8eef2;
    font:12px/1.6 ui-monospace,monospace;max-width:320px}
  #estado b{color:#9ae6b4}
  #estado .mal{color:#ff8a8a}
  #estado .aviso{color:#ffd166}
  #panel{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(10,13,16,.92);border:1px solid #232c33;border-radius:12px;
    padding:10px 14px;color:#e8eef2;font:12px/1.5 ui-monospace,monospace;width:320px}
  #panel label{display:block;margin:6px 0 2px}
  #panel .val{float:right;color:#ffd166}
  #panel input{width:100%;box-sizing:border-box}
</style>
</head>
<body>
<div id="map"></div>
<div id="estado">
  <div><b>Test coche 3D</b></div>
  <div>Estado: <span id="e1">iniciando…</span></div>
  <div>Capas: <span id="e2">-</span></div>
  <div>Giro real: <span id="e3">-</span></div>
</div>
<div id="panel">
  <label>Escala <span class="val" id="escVal">1.00x</span></label>
  <input type="range" id="escSlider" min="0.001" max="20" step="0.001" value="1">
  <label>Altura <span class="val" id="altVal">0.00 m</span></label>
  <input type="range" id="altSlider" min="-5" max="20" step="0.1" value="0">
  <label>Giro Z <span class="val" id="rotZVal">0°</span></label>
  <input type="range" id="rotZSlider" min="-180" max="180" step="1" value="0">
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const MAPTILER_KEY='sG00UkBX9Ig2ifguvPgU';
const POS = [-2.9387, 43.2678];   // Torre Iberdrola, Bilbao
let carScale = 1.0;
let carAltura = 0.0;
let carRotationZ = 0;
let carBearing = 45;   // fijo, solo para ver que la rotacion funciona

const e1 = document.getElementById('e1');
const e2 = document.getElementById('e2');
const e3 = document.getElementById('e3');

const map = new maplibregl.Map({
  container:'map',
  style:'https://api.maptiler.com/maps/streets-v2/style.json?key='+MAPTILER_KEY,
  center: POS,
  zoom: 18, pitch: 60, bearing: 0
});

map.on('error', e => {
  const msg = e.error && e.error.message || String(e.error);
  e1.innerHTML = '<span class="mal">ERROR: '+msg+'</span>';
});

map.on('load', () => {
  e1.innerHTML = '<b>mapa OK</b>';
  try {
    map.addLayer(crearCapaCoche());
    e2.textContent = 'añadida';
  } catch(e){
    e1.innerHTML = '<span class="mal">fallo capa: '+e.message+'</span>';
  }
});

function crearCapaCoche(){
  return {
    id: 'coche-3d',
    type: 'custom',
    renderingMode: '3d',
    onAdd(map, gl){
      this.map = map;
      this.camera = new THREE.Camera();
      this.scene = new THREE.Scene();

      this.scene.add(new THREE.AmbientLight(0xffffff, 2.0));
      const dir = new THREE.DirectionalLight(0xffffff, 2.0);
      dir.position.set(0, -1, 1).normalize();
      this.scene.add(dir);

      // ==== FIX #1: renderer sin fondo ====
      this.renderer = new THREE.WebGLRenderer({
        canvas: map.getCanvas(),
        context: gl,
        antialias: true,
        alpha: true,
        premultipliedAlpha: true
      });
      this.renderer.autoClear = false;
      this.renderer.autoClearColor = false;
      this.renderer.autoClearDepth = false;
      this.renderer.setPixelRatio(1);
      this.renderer.setClearColor(0x000000, 0);
      this.renderer.setClearAlpha(0);

      // ==== FIX #2: grupo exterior (rumbo) + grupo interior (conversion ejes) ====
      this.modelGroup = new THREE.Group();   // rotacion Z (rumbo) en el mundo
      this.innerGroup = new THREE.Group();   // conversion ejes Y-arriba -> Z-arriba
      this.innerGroup.rotation.x = Math.PI / 2;
      this.modelGroup.add(this.innerGroup);
      this.scene.add(this.modelGroup);

      cargarModelo(this);
    },
    render(gl, matrix){
      if (!this.renderer || !this.modelGroup || !this.loaded) return;
      const mc = maplibregl.MercatorCoordinate.fromLngLat(
        { lng: POS[0], lat: POS[1] }, carAltura);
      const s = mc.meterInMercatorCoordinateUnits();

      // Translacion + escala + rotacion Z (rumbo)
      const rz = new THREE.Matrix4().makeRotationZ(
        (-carBearing + carRotationZ) * Math.PI/180);
      const mt = new THREE.Matrix4()
        .makeTranslation(mc.x, mc.y, mc.z)
        .scale(new THREE.Vector3(s*carScale, -s*carScale, s*carScale))
        .multiply(rz);

      this.modelGroup.matrix = mt;
      this.modelGroup.matrixAutoUpdate = false;

      this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix);
      this.renderer.resetState();
      this.renderer.render(this.scene, this.camera);
    },
    onRemove(){
      if (this.renderer) this.renderer.dispose();
    }
  };
}

async function cargarModelo(capa){
  const loader = new GLTFLoader();
  e1.innerHTML = '<span class="aviso">cargando car.glb…</span>';
  try {
    const gltf = await new Promise((resolve, reject) => loader.load(
      './assets/car.glb',
      resolve,
      ev => { if(ev.lengthComputable) e1.innerHTML = '<span class="aviso">cargando… ' + Math.round(ev.loaded/ev.total*100) + '%</span>'; },
      reject
    ));
    const modelo = gltf.scene;

    // Centrar en XZ (para que gire sobre su centro) y apoyar en Y=0
    const box = new THREE.Box3().setFromObject(modelo);
    const c = box.getCenter(new THREE.Vector3());
    modelo.position.x -= c.x;
    modelo.position.z -= c.z;
    modelo.position.y -= box.min.y;
    modelo.traverse(o => { if(o.isMesh){ o.castShadow=false; o.receiveShadow=false; } });

    // Añadir al grupo INTERNO (no al exterior)
    capa.innerGroup.add(modelo);
    capa.loaded = true;

    // Info util para ti: tamaño real del modelo
    const tam = new THREE.Vector3();
    box.getSize(tam);
    e1.innerHTML = '<b>modelo OK</b>';
    e2.textContent = 'tamaño GLB: ' +
      tam.x.toFixed(2) + ' × ' + tam.y.toFixed(2) + ' × ' + tam.z.toFixed(2);
    e3.textContent = carBearing + '°';
  } catch(e){
    e1.innerHTML = '<span class="mal">ERROR cargando: '+e.message+'</span>';
    console.error(e);
  }
}

/* Sliders */
const escSlider = document.getElementById('escSlider');
const altSlider = document.getElementById('altSlider');
const rotZSlider = document.getElementById('rotZSlider');
escSlider.oninput = () => {
  carScale = +escSlider.value;
  document.getElementById('escVal').textContent = carScale.toFixed(3) + 'x';
  map.triggerRepaint();
};
altSlider.oninput = () => {
  carAltura = +altSlider.value;
  document.getElementById('altVal').textContent = carAltura.toFixed(2) + ' m';
  map.triggerRepaint();
};
rotZSlider.oninput = () => {
  carRotationZ = +rotZSlider.value;
  document.getElementById('rotZVal').textContent = (carRotationZ>0?'+':'') + carRotationZ + '°';
  map.triggerRepaint();
};
</script>
</body>
</html>
