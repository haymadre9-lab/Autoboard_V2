<script>
const MAPTILER_KEY='sG00UkBX9Ig2ifguvPgU';
const antialiasActivo = new URLSearchParams(location.search).get('aa')==='1';
const errores = [];

function registrarError(tipo, mensaje){
  errores.push({tipo,mensaje});
  document.getElementById('rErrores').textContent = errores.length;
  const el = document.getElementById('errlog');
  el.classList.add('on');
  el.innerHTML = errores.map(e=>'<b>['+e.tipo+']</b> '+e.mensaje).join('<br><br>');
}

const map = new maplibregl.Map({
  container:'map',
  style:'https://api.maptiler.com/maps/streets-v2/style.json?key='+MAPTILER_KEY,
  center:[-2.9387,43.2678], zoom:16, pitch:60, bearing:0,

document.getElementById('btnAA').textContent = antialiasActivo?'🪄 Antialias: ON (recargar)':'🪄 Antialias: OFF (recargar)';
document.getElementById('btnAA').onclick = () => { location.href = location.pathname + (antialiasActivo?'':'?aa=1'); };

let webglOk = true;
map.on('error', e => {
  const msg = e.error && e.error.message || String(e.error||'desconocido');
  if(/webgl|context/i.test(msg)){ webglOk=false; document.getElementById('rWebgl').innerHTML='<span class="mal">FALLO</span>'; }
  registrarError('map', msg);
});

// ==== ITER 1: imagen de flecha para la ruta (canvas -> data URL) ====
// Generamos una flecha blanca en un canvas transparente y la registramos
// como imagen de MapLibre. Se usa en la capa symbol encima de la linea.
function crearImagenFlecha(){
  const size = 40;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,size,size);
  // Flecha blanca con contorno oscuro para que se vea sobre azul y sobre satelite
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  // Cabeza de flecha apuntando hacia arriba (0 grados = norte)
  ctx.moveTo(size/2, 6);          // punta
  ctx.lineTo(size-8, size-8);     // esquina inferior derecha
  ctx.lineTo(size/2, size-14);    // hueco central
  ctx.lineTo(8, size-8);          // esquina inferior izquierda
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  return { data: ctx.getImageData(0,0,size,size), width: size, height: size };
}

// ==== ITER 1: zoom base mas cercano ====
let navZoomBase = 18.8;   // antes 18.2

let idFuenteBuildings=null, sourceLayerBuildings=null, edificiosOn=true;
map.on('load', () => {
  document.getElementById('rArranque').innerHTML = '<b>OK</b>';
  document.getElementById('rWebgl').innerHTML = webglOk?'<b>OK</b>':'<span class="mal">FALLO</span>';

  // ==== ITER 1: registrar la imagen de la flecha ====
  try {
    const img = crearImagenFlecha();
    if(!map.hasImage('ruta-flecha')) map.addImage('ruta-flecha', img, {sdf:false});
  } catch(e){ console.warn('No se pudo añadir imagen de flecha', e); }

  const estilo = map.getStyle();
  const fuentes = Object.keys(estilo.sources).filter(k => estilo.sources[k].type==='vector');
  const cand = [];
  for(const src of fuentes) for(const l of estilo.layers)
    if(l.source===src && /building/i.test(l['source-layer']||''))
      cand.push({source:src, sourceLayer:l['source-layer']});
  if(!cand.length){
    document.getElementById('rBuildings').innerHTML = '<span class="mal">sin capa de edificios</span>';
    return;
  }
  idFuenteBuildings = cand[0].source;
  sourceLayerBuildings = cand[0].sourceLayer;

  map.once('idle', () => document.getElementById('rTiles').innerHTML = webglOk?'<b>OK</b>':'<span class="mal">con errores</span>');

  let idEtiquetas;
  for(const l of estilo.layers) if(l.type==='symbol' && l.layout && l.layout['text-field']){ idEtiquetas=l.id; break; }

  try{
    map.addLayer({
      id:'3d-buildings', source:idFuenteBuildings, 'source-layer':sourceLayerBuildings,
      type:'fill-extrusion', minzoom:14,
      paint:{
        // ==== ITER 1: edificios mas claros ====
        'fill-extrusion-color':'#8a93a0',
        'fill-extrusion-height':['coalesce',['get','render_height'],8],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
        'fill-extrusion-opacity':0.9
      }
    }, idEtiquetas);
  }catch(e){
    document.getElementById('rBuildings').innerHTML = '<span class="mal">fallo capa: '+e.message+'</span>';
    registrarError('3d-buildings', e.message);
    return;
  }

  map.once('idle', () => {
    let feats=[];
    try{ feats = map.queryRenderedFeatures({layers:['3d-buildings']}); }catch(e){}
    document.getElementById('rBuildings').innerHTML = feats.length
      ? '<b>OK</b> — '+feats.length+' edificios'
      : '<span class="aviso">capa añadida, 0 edificios visibles</span>';
  });
});

document.getElementById('btnEdificios').onclick = function(){

let contadorRenders = 0;
map.on('render', () => contadorRenders++);

function medirDurante(ms, id, mover){
  return new Promise(resolve => {
    const muestras = [];
    let lc = contadorRenders, lt = performance.now();
    const iv = setInterval(() => {
      const a = performance.now(), dt = (a-lt)/1000;
      muestras.push(Math.round((contadorRenders-lc)/dt));
      lc = contadorRenders; lt = a;
    }, 250);
    const antes = errores.length, t0 = performance.now();
    function paso(ts){
      const p = (ts-t0)/ms;
      if(p>=1){
        clearInterval(iv);
        const media = Math.round(muestras.reduce((a,b)=>a+b,0)/muestras.length);
        document.getElementById(id).innerHTML = '<b>media '+media+'</b> fps' +
          (errores.length-antes?' — <span class="mal">'+(errores.length-antes)+' err</span>':'');
        resolve(); return;
      }
      mover(p,ts);
      requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  });
}

document.getElementById('btnRot').onclick = async function(){
  this.disabled = true;
  document.getElementById('rRot').innerHTML = '<span class="aviso">girando 10s…</span>';
  const b0 = map.getBearing();
  await medirDurante(10000,'rRot', p => map.setBearing((b0+p*720)%360));

document.getElementById('btnPitchTest').onclick = async function(){

const TT = 'zMPqeYVXNoQw4rJ1ycr8QdywkDFNx0tF';
function dist(a,b){
  const R=6371000, la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180;
  const dla=(b[0]-a[0])*Math.PI/180, dlo=(b[1]-a[1])*Math.PI/180;
  const h=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
  const la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180, dlo=(b[1]-a[1])*Math.PI/180;
  const y=Math.sin(dlo)*Math.cos(la2);
  const x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dlo);
  return ((Math.atan2(y,x)*180/Math.PI)+360)%360;
}
function urlGeocodificar(t){
  return 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(t);
}
function urlRutaTomTom(o,d){
  return 'https://api.tomtom.com/routing/1/calculateRoute/'+o[0]+','+o[1]+':'+d[0]+','+d[1]
    +'/json?key='+TT+'&routeType=fastest&traffic=true&travelMode=car&instructionsType=text&language=es-ES';
}
const TURN_GEOM = {
  'straight':{turn:0,R:0},'slight right':{turn:35,R:26},right:{turn:90,R:15},
  'sharp right':{turn:150,R:10},uturn:{turn:178,R:9},'sharp left':{turn:-150,R:10},
  left:{turn:-90,R:15},'slight left':{turn:-35,R:26}
};
function arrowSVG(mod,col){
  const g=TURN_GEOM[mod]||TURN_GEOM.straight;
  if(!g.turn) return '<svg viewBox="0 0 48 52"><path d="M24 48V10M14 20L24 8 34 20" stroke="'+(col||'#0a8a34')+'" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const dir = g.turn>0?1:-1;
  const pts=[];
  for(let i=0;i<=20;i++){
    const a=(180+dir*Math.abs(g.turn)*i/20)*Math.PI/180;
    pts.push({x:24+dir*g.R+g.R*Math.cos(a), y:46+g.R*Math.sin(a)});
  }
  return '<svg viewBox="0 0 48 52"><path d="'+pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')
    +'" fill="none" stroke="'+(col||'#0a8a34')+'" stroke-width="7" stroke-linecap="round"/></svg>';
}
function maneuverSVG(s,hw){
  const m=s.maneuver||{};
  const col=hw?'#fff':'#0a8a34';
  if(m.type==='arrive') return '<svg viewBox="0 0 48 52"><circle cx="24" cy="26" r="15" fill="'+col+'"/><circle cx="24" cy="26" r="6" fill="#fff"/></svg>';
  return arrowSVG(m.modifier,col);
}
function ttMan(it){
  const m=(it.maneuver||it.instructionType||'').toString().toUpperCase();
  if(m.includes('ARRIVE')||m.includes('WAYPOINT')) return {type:'arrive'};
  let mod='straight';
  if(m.includes('SHARP_LEFT')) mod='sharp left';
  else if(m.includes('SHARP_RIGHT')) mod='sharp right';
  else if(m.includes('BEAR_LEFT')||m.includes('KEEP_LEFT')||m.includes('SLIGHT_LEFT')) mod='slight left';
  else if(m.includes('BEAR_RIGHT')||m.includes('KEEP_RIGHT')||m.includes('SLIGHT_RIGHT')) mod='slight right';
  else if(m.includes('LEFT')) mod='left';
  else if(m.includes('RIGHT')) mod='right';
  else if(m.includes('UTURN')||m.includes('U_TURN')) mod='uturn';
  return {type:'turn',modifier:mod};
}
let steps=[], stepIdx=0, routeCoordsLL=[], routeCumDist=[], routeProgIdx=0;
let ultimoStepPintado='', zoomManiobraOn=false;
let ultimaRutaDestino=null;
function segDistM2(p,a,b){
  const mx=111320*Math.cos(p[0]*Math.PI/180), my=110540;
  const px=p[1]*mx, py=p[0]*my, ax=a[1]*mx, ay=a[0]*my, bx=b[1]*mx, by=b[0]*my;
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  const t=L2?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L2)):0;
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function actualizarRouteProgIdx(ll){
  if(!routeCoordsLL.length) return;
  const i0=Math.max(0,routeProgIdx-8), i1=Math.min(routeCoordsLL.length-1, routeProgIdx+500);
  let mejor=routeProgIdx, md=Infinity;
  for(let i=i0;i<i1;i++){
    const d=segDistM2(ll, routeCoordsLL[i], routeCoordsLL[i+1]);
    if(d<md){ md=d; mejor=i; }
  }
  routeProgIdx=mejor;
  return md;
}
function recorridoAhora(ll){
  const i=routeProgIdx;
  if(!routeCoordsLL.length) return 0;
  const base=routeCumDist[i]||0;
  if(i>=routeCoordsLL.length-1) return base;
  const a=routeCoordsLL[i], b=routeCoordsLL[i+1];
  const mx=111320*Math.cos(a[0]*Math.PI/180), my=110540;
  const ax=a[1]*mx, ay=a[0]*my, bx=b[1]*mx, by=b[0]*my, px=ll[1]*mx, py=ll[0]*my;
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  const t=L2?Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L2)):0;
  return base + t*Math.sqrt(L2);
}
function avanzarPaso(r){
  while(stepIdx<steps.length-1 && (steps[stepIdx].metro||0)<=r+15) stepIdx++;
}
function renderStep(){
  const s=steps[stepIdx];
  if(!s || !steps.length){ document.getElementById('navbanner').style.display='none'; return Infinity; }
  const nb=document.getElementById('navbanner');
  nb.style.display='flex';
  const ref=lastFix?[lastFix.lat,lastFix.lon]:(routeCoordsLL[routeProgIdx]||[0,0]);
  const d=Math.max(0, (s.metro||0) - recorridoAhora(ref));
  const hw=!!s.hw, clave=stepIdx+'|'+hw;
  if(clave!==ultimoStepPintado){
    ultimoStepPintado=clave;
    nb.classList.toggle('hw', hw);
    document.getElementById('navarrow').innerHTML = maneuverSVG(s, hw);
    document.getElementById('navsub').textContent = s.calle||s.msg||'';
  }
  document.getElementById('navd').textContent = d<1000 ? Math.round(d)+' m' : (d/1000).toFixed(1)+' km';
  return d;
}
let gpsOn=false, watchId=null, seguirOn=false;
let lastFix=null, heading=0, speedKmh=0;
let histFixes=[], headingHist=[];
let camPosActual=null, camPosObjetivo=null;
let camBearingActual=0, camBearingObjetivo=0;
let camZoomActual=18.8, camZoomObjetivo=18.8;
// ==== ITER 1: modo camara (seguir vs libre al parar) ====
let camaraLibre = false;   // cuando esta en true, el bucle NO mueve la camara
function rumboDelGPS(c,now,v){
  histFixes.push(now); if(histFixes.length>14) histFixes.shift();
  if(Number.isFinite(c.heading)&&v>=3) return ((c.heading%360)+360)%360;
  if(v<3) return null;
  for(let i=histFixes.length-2;i>=0;i--){
    const f=histFixes[i];
    if(now.t-f.t>12000) break;
    if(dist([f.lat,f.lon],[now.lat,now.lon]) >= Math.min(35,Math.max(20,v*4)))
      return bearing([f.lat,f.lon],[now.lat,now.lon]);
  }
  return null;
}
function filtrarHeading(h){
  if(!Number.isFinite(h)) return;
  headingHist.push(h); if(headingHist.length>8) headingHist.shift();
  let sx=0, sy=0;
  for(const a of headingHist){ const r=a*Math.PI/180; sx+=Math.cos(r); sy+=Math.sin(r); }
  heading = Math.atan2(sy,sx)*180/Math.PI;
  if(heading<0) heading+=360;
}
const elCoche = document.createElement('div');
elCoche.innerHTML = '<svg class="coche" viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 16 L4 20 Z" fill="#3fa9ff" stroke="#fff" stroke-width="1.5"/></svg>';
const marcadorCoche = new maplibregl.Marker({element:elCoche, rotationAlignment:'map'});
let distanciaFueraRuta=0, fueraDesde=0, recalculando=false, ultimoRecalculo=0;
const DESVIO_M=45, CONFIRMACION_MS=2500, COOLDOWN_MS=10000;
function distanciaRutaActual(ll){
  if(!routeCoordsLL.length) return Infinity;
  const i0=Math.max(0,routeProgIdx-20), i1=Math.min(routeCoordsLL.length-1, routeProgIdx+500);
  let md=Infinity;
  for(let i=i0;i<i1;i++) md=Math.min(md, segDistM2(ll, routeCoordsLL[i], routeCoordsLL[i+1]));
  return md;
}
async function calcularRuta(origen, destino, modo='normal'){
  if(recalculando) return false;
  recalculando = true;
  if(modo==='recalculo') document.getElementById('g5').innerHTML='<span class="aviso">↻ recalculando ruta…</span>';
  try{
    const r = await fetch(urlRutaTomTom(origen,destino));
    const j = await r.json();
    if(!j.routes||!j.routes.length) throw new Error('TomTom no devolvió ruta');
    const ruta = j.routes[0];
    const coords = ruta.legs.flatMap(l=>l.points.map(p=>[p.longitude,p.latitude]));
    const geojson = {type:'Feature', geometry:{type:'LineString', coordinates:coords}};
    if(map.getSource('ruta')) map.getSource('ruta').setData(geojson);
    else {
      map.addSource('ruta', {type:'geojson', data:geojson});
      // ==== ITER 1: linea base (mas ancha) + capa symbol con flechas ====
      map.addLayer({id:'ruta', type:'line', source:'ruta',
        paint:{'line-color':'#1e88e5','line-width':8,'line-opacity':.9},
        layout:{'line-cap':'round','line-join':'round'}});
      map.addLayer({id:'ruta-flechas', type:'symbol', source:'ruta',
        layout:{
          'symbol-placement':'line',
          'symbol-spacing':80,          // cada 80 px aparece una flecha
          'icon-image':'ruta-flecha',
          'icon-size':0.45,
          'icon-rotation-alignment':'map',
          'icon-allow-overlap':true,
          'icon-ignore-placement':true
        }});
    }
    routeCoordsLL = coords.map(c=>[c[1],c[0]]);
    routeCumDist = [0];
    for(let i=1;i<routeCoordsLL.length;i++)
      routeCumDist.push(routeCumDist[i-1] + dist(routeCoordsLL[i-1], routeCoordsLL[i]));
    steps = (ruta.guidance && ruta.guidance.instructions || []).map(it=>{
      const off=it.routeOffsetInMeters, pi=it.pointIndex;
      const porIndice = Number.isInteger(pi)&&pi>=0&&pi<routeCumDist.length ? routeCumDist[pi] : null;
      const metroFinal = porIndice!==null && (off==null || Math.abs(porIndice-off)<=Math.max(300,off*.1))
        ? porIndice : (off||0);
      return { metro:metroFinal, calle:it.street||'', msg:it.message||'',
               maneuver:ttMan(it), hw:/autopista|autov[ií]a|\b(a|ap)-?\d/i.test(it.street||'') };
    });
    stepIdx=0; routeProgIdx=0; ultimoStepPintado=''; zoomManiobraOn=false;
    camZoomObjetivo = navZoomBase;
    renderStep();
    const km=(ruta.summary.lengthInMeters/1000).toFixed(1);
    const min=Math.round(ruta.summary.travelTimeInSeconds/60);
    document.getElementById('g5').innerHTML = '<b>'+km+' km · '+min+' min</b>';
    return true;
  }catch(e){
    document.getElementById('g5').innerHTML='<span class="mal">error de ruta: '+e.message+'</span>';
    registrarError('tomtom', e.message);
    return false;
  }finally{ recalculando = false; }
}
async function comprobarDesvio(ll){
  if(!routeCoordsLL.length || !ultimaRutaDestino || recalculando) return;
  const d = distanciaRutaActual(ll);
  distanciaFueraRuta = d;
  document.getElementById('g7').textContent = Math.round(d)+' m';
  if(d>DESVIO_M){
    if(!fueraDesde) fueraDesde = performance.now();
    if(performance.now()-fueraDesde > CONFIRMACION_MS && performance.now()-ultimoRecalculo > COOLDOWN_MS){
      ultimoRecalculo = performance.now();
      fueraDesde = 0;
      await calcularRuta([ll[0],ll[1]], ultimaRutaDestino, 'recalculo');
    }
  } else fueraDesde = 0;
}
function onFix(pos){
  const c=pos.coords;
  const now={lat:c.latitude, lon:c.longitude, t:pos.timestamp||Date.now()};
  const v = Number.isFinite(c.speed) ? Math.max(0,c.speed) : 0;
  speedKmh = v*3.6;

  // ==== ITER 1: al parar, ceder el control al usuario ====
  const parado = speedKmh < 3;
  if(parado !== camaraLibre){
    camaraLibre = parado;
    document.getElementById('g8').textContent = parado ? 'libre (parado)' : 'seguir';
  }

  if(parado && lastFix){
    document.getElementById('g2').textContent = Math.round(speedKmh)+' km/h';
    document.getElementById('g3').textContent = Math.round(heading)+'°';
    actualizarHUD();
    comprobarDesvio([now.lat, now.lon]);
    return;
  }
  const h = rumboDelGPS(c,now,v);
  if(h!==null) filtrarHeading(h);
  if(!marcadorCoche._map) marcadorCoche.setLngLat([now.lon,now.lat]).addTo(map);
  else marcadorCoche.setLngLat([now.lon,now.lat]);
  marcadorCoche.setRotation(heading);
  document.getElementById('g2').textContent = Math.round(speedKmh)+' km/h';
  document.getElementById('g3').textContent = Math.round(heading)+'°';
  actualizarHUD();
  camPosObjetivo = [now.lon, now.lat];
  camBearingObjetivo = heading;
  if(!camPosActual){
    camPosActual = camPosObjetivo.slice();
    camBearingActual = camBearingObjetivo;
    camZoomActual = camZoomObjetivo = navZoomBase;
  }
  lastFix = now;
  if(steps.length){
    const ll=[now.lat,now.lon];
    actualizarRouteProgIdx(ll);
    const recorrido = recorridoAhora(ll);
    avanzarPaso(recorrido);
    const d = renderStep();
    const s = steps[stepIdx];
    if(s && seguirOn){
      const cerca = d<180 && s.maneuver && s.maneuver.type!=='arrive';
      if(cerca !== zoomManiobraOn){
        zoomManiobraOn = cerca;
        camZoomObjetivo = cerca ? Math.min(19.8, navZoomBase+1.2) : navZoomBase;
      }
    }
  } else {
    renderStep();
  }
  comprobarDesvio([now.lat, now.lon]);
}
function actualizarHUD(){
  const vel = document.getElementById('hudVel');
  const rum = document.getElementById('hudRum');
  if(vel) vel.textContent = Math.round(speedKmh)+' km/h';
  if(rum){
    const dirs=['N','NE','E','SE','S','SO','O','NO'];
    const idx = Math.round(heading/45)%8;
    rum.textContent = dirs[idx]+' '+Math.round(heading)+'°';
  }
}
function bucleSeguimiento(){
  // ==== ITER 1: si la camara esta libre (parado), no hacemos nada ====
  if(seguirOn && !camaraLibre && camPosActual && camPosObjetivo){
    const k=.18;
    camPosActual[0] += (camPosObjetivo[0]-camPosActual[0])*k;
    camPosActual[1] += (camPosObjetivo[1]-camPosActual[1])*k;
    let dB = camBearingObjetivo - camBearingActual;
    while(dB>180) dB-=360;
    while(dB<-180) dB+=360;
    camBearingActual += dB*.14;
    camZoomActual += (camZoomObjetivo-camZoomActual)*.10;
    const dx=Math.abs(camPosObjetivo[0]-camPosActual[0]);
    const dy=Math.abs(camPosObjetivo[1]-camPosActual[1]);
    const dz=Math.abs(camZoomObjetivo-camZoomActual);
    const quieto = dx<1e-6 && dy<1e-6 && dz<0.001;
    if(!quieto){
      map.jumpTo({center:camPosActual, bearing:camBearingActual, zoom:camZoomActual});
    }
  }
  requestAnimationFrame(bucleSeguimiento);
}
requestAnimationFrame(bucleSeguimiento);
document.getElementById('btnGPS').onclick = function(){
  gpsOn = !gpsOn;
  this.textContent = '📍 GPS: '+(gpsOn?'ON':'OFF');
  this.classList.toggle('on', gpsOn);
  if(gpsOn){
    document.getElementById('g1').innerHTML = '<b>activo</b>';
    watchId = navigator.geolocation.watchPosition(onFix, e => {
      document.getElementById('g1').innerHTML = '<span class="mal">error: '+e.message+'</span>';
      registrarError('gps', e.message);
    }, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
  } else {
    if(watchId!==null) navigator.geolocation.clearWatch(watchId);
    document.getElementById('g1').textContent = 'apagado';
  }
};
document.getElementById('btnSeguir').onclick = function(){
  seguirOn = !seguirOn;
  this.textContent = '🧭 Seguir: '+(seguirOn?'ON':'OFF');
  this.classList.toggle('on', seguirOn);
  if(seguirOn && lastFix){
    camaraLibre = false;
    camZoomObjetivo = navZoomBase;
    map.jumpTo({center:[lastFix.lon,lastFix.lat], bearing:heading, zoom:camZoomObjetivo, pitch:60});
  }
};
let fpsMarchaUltimoT=0, fpsMarchaUltimoConteo=0;
setInterval(()=>{
  if(!gpsOn){ fpsMarchaUltimoT=0; return; }
  const a = performance.now();
  if(!fpsMarchaUltimoT){ fpsMarchaUltimoT=a; fpsMarchaUltimoConteo=contadorRenders; return; }
  const dt = (a-fpsMarchaUltimoT)/1000;
  document.getElementById('g4').textContent = Math.round((contadorRenders-fpsMarchaUltimoConteo)/dt)+' fps';
  fpsMarchaUltimoT = a; fpsMarchaUltimoConteo = contadorRenders;
}, 1000);
document.getElementById('btnDestino').onclick = async function(){
  if(!lastFix){ alert('Activa el GPS primero.'); return; }
  const texto = prompt('¿A dónde vamos?','');
  if(!texto) return;
  document.getElementById('g5').innerHTML = '<span class="aviso">buscando dirección…</span>';
  try{
    const r = await fetch(urlGeocodificar(texto));
    const j = await r.json();
    if(!j.length){ document.getElementById('g5').innerHTML='<span class="mal">no se encontró</span>'; return; }
    ultimaRutaDestino = [parseFloat(j[0].lat), parseFloat(j[0].lon)];
    document.getElementById('g5').innerHTML = '<span class="aviso">calculando ruta…</span>';
    const ok = await calcularRuta([lastFix.lat,lastFix.lon], ultimaRutaDestino);
    if(ok){
      if(seguirOn){
        camaraLibre = false;
        camZoomObjetivo = navZoomBase;
        map.jumpTo({center:[lastFix.lon,lastFix.lat], bearing:heading, zoom:navZoomBase, pitch:60});
      } else {
        const bounds = routeCoordsLL.reduce((b,c)=>b.extend([c[1],c[0]]),
          new maplibregl.LngLatBounds([routeCoordsLL[0][1],routeCoordsLL[0][0]],
                                     [routeCoordsLL[0][1],routeCoordsLL[0][0]]));
        map.fitBounds(bounds, {padding:60, pitch:0, maxZoom:17.5});
      }
    }
  }catch(e){
    document.getElementById('g5').innerHTML = '<span class="mal">error: '+e.message+'</span>';
    registrarError('ruta', e.message);
  }
};
</script>
