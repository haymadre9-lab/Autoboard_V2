<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>autoboard-next · Fase 1</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0e12;overflow:hidden}
  #map{position:absolute;inset:0}
  /* Panel de diagnostico: las 4 preguntas de la Fase 1, respondidas en vivo, no adivinadas */
  #diag{position:fixed;top:10px;left:10px;z-index:10;background:rgba(10,13,16,.82);
    border:1px solid #232c33;border-radius:10px;padding:10px 14px;color:#e8eef2;
    font:12px/1.6 ui-monospace,monospace;max-width:300px}
  #diag b{color:#9ae6b4}
  #diag .mal{color:#ff8a8a}
  #fps{position:fixed;top:10px;right:10px;z-index:10;background:rgba(10,13,16,.82);
    border:1px solid #232c33;border-radius:10px;padding:8px 12px;color:#e8eef2;
    font:700 13px ui-monospace,monospace}
  #controles{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;gap:8px}
  #controles button{background:#12161c;border:1px solid #232c33;color:#e8eef2;
    border-radius:10px;padding:12px 16px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<div id="diag">
  <div><b>FASE 1 — solo mapa, nada mas</b></div>
  <div>1) ¿Arranca? <span id="q1">cargando…</span></div>
  <div>2) ¿Teselas cargan fluido? <span id="q2">esperando…</span></div>
  <div>3) ¿Giro/inclinacion fluidos? <span id="q3">prueba con los botones</span></div>
  <div>4) FPS en movimiento: <span id="q4">-</span></div>
</div>
<div id="fps">-- fps</div>
<div id="controles">
  <button id="btnGirar">🔄 Girar</button>
  <button id="btnInclinar">📐 Inclinar</button>
  <button id="btnEdificios">🏢 Edificios 3D</button>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ============================================================================
   FASE 1 -- SOLO ESTO. Nada de TomTom, nada de GPS, nada de radares, nada de
   carpetas. El unico objetivo de este archivo es contestar 4 preguntas antes
   de invertir una sola hora mas en este proyecto. Si esto va mal en el Tesla,
   se acaba aqui y no ha costado nada. Reutiliza la MISMA clave de MapTiler que
   ya usa AutoBoard V2 para las teselas planas -- no hace falta un proveedor
   nuevo para esta prueba.
   ============================================================================ */
const MAPTILER_KEY = 'sG00UkBX9Ig2ifguvPgU';

// Centrado en Bilbao/Vizcaya -- la zona real donde se va a probar, no un sitio generico
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://api.maptiler.com/maps/streets-v2/style.json?key=' + MAPTILER_KEY,
  center: [-2.9873281, 43.2785784],
  zoom: 16,
  pitch: 45,
  bearing: 0,
  antialias: true
});

// ---- Pregunta 1: ¿arranca? ----
map.on('error', e => {
  document.getElementById('q1').innerHTML = '<span class="mal">ERROR: ' + (e.error ? e.error.message : 'desconocido') + '</span>';
});

let primerRenderVisto = false;
map.on('load', () => {
  document.getElementById('q1').innerHTML = '<b>SI, cargo</b>';

  // ---- Edificios en 3D: capa de extrusion sobre las teselas vectoriales de MapTiler ----
  const capas = map.getStyle().layers;
  let idEtiquetas;
  for (const l of capas) { if (l.type === 'symbol' && l.layout && l.layout['text-field']) { idEtiquetas = l.id; break; } }
  map.addLayer({
    id: '3d-buildings',
    source: 'openmaptiles',
    'source-layer': 'building',
    type: 'fill-extrusion',
    minzoom: 14,
    paint: {
      'fill-extrusion-color': '#3a4552',
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-opacity': 0.85
    }
  }, idEtiquetas);
});

// ---- Pregunta 2: ¿las teselas cargan fluido, o se quedan a medias? ----
let teselasEsperando = 0, teselasError = 0;
map.on('dataloading', () => { teselasEsperando++; });
map.on('idle', () => {
  document.getElementById('q2').innerHTML = teselasError > 0
    ? '<span class="mal">' + teselasError + ' con error</span>'
    : '<b>sin peticiones pendientes</b>';
});
map.on('error', () => { teselasError++; });

// ---- Pregunta 3: giro e inclinacion, a mano, con dos botones ----
document.getElementById('btnGirar').onclick = () => {
  const t0 = performance.now();
  map.easeTo({ bearing: (map.getBearing() + 180) % 360, duration: 1500 });
  document.getElementById('q3').textContent = 'girando… mira si va a saltos';
};
document.getElementById('btnInclinar').onclick = () => {
  map.easeTo({ pitch: map.getPitch() > 30 ? 0 : 60, duration: 1200 });
};
let edificiosOn = true;
document.getElementById('btnEdificios').onclick = () => {
  edificiosOn = !edificiosOn;
  if (map.getLayer('3d-buildings')) map.setLayoutProperty('3d-buildings', 'visibility', edificiosOn ? 'visible' : 'none');
};

// ---- Pregunta 4: FPS real mientras el mapa se mueve, no en reposo (eso no dice nada) ----
let n = 0, t = performance.now(), fpsRaf = null;
function fpsTick(){
  n++;
  const ahora = performance.now();
  if (ahora - t >= 1000){
    const fps = n;
    document.getElementById('fps').textContent = fps + ' fps';
    document.getElementById('q4').innerHTML = fps < 20 ? '<span class="mal">' + fps + ' (bajo)</span>' : '<b>' + fps + '</b>';
    n = 0; t = ahora;
  }
  fpsRaf = requestAnimationFrame(fpsTick);
}
fpsRaf = requestAnimationFrame(fpsTick);
</script>
</body>
</html>
