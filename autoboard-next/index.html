<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>test</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>html,body{margin:0;height:100%}#map{position:absolute;inset:0}</style>
</head>
<body>
<div id="map"></div>
<div id="log" style="position:fixed;top:10px;left:10px;background:#000;color:#0f0;font:14px monospace;padding:10px;z-index:99">cargando...</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const log = document.getElementById('log');
log.textContent = 'maplibre-gl cargado: ' + (typeof maplibregl);
window.onerror = (m) => { log.textContent = 'ERROR: ' + m; log.style.color = '#f00'; };
try {
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://api.maptiler.com/maps/streets-v2/style.json?key=sG00UkBX9Ig2ifguvPgU',
    center: [-2.9387, 43.2678],
    zoom: 16
  });
  map.on('load', () => { log.textContent = 'MAPA OK — carga correctamente'; log.style.color = '#0f0'; });
  map.on('error', (e) => { log.textContent = 'ERROR MAPA: ' + (e.error?.message || e); log.style.color = '#f00'; });
} catch(e) {
  log.textContent = 'EXCEPCION: ' + e.message;
  log.style.color = '#f00';
}
</script>
</body>
</html>
