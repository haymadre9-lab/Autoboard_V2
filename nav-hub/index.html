<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nav Hub</title>
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b1220;color:#e8eefc;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
#top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#111a2e;height:56px}
#top h1{margin:0;font-size:20px;flex:1;letter-spacing:.5px}
.ctl{flex:0 0 auto;height:42px;min-width:52px;padding:0 12px;border:0;border-radius:12px;background:#243252;color:#fff;font-size:22px}
.ctl.on{background:#f59e0b;color:#111}
#inst{display:none;background:#22c55e;color:#04210f;font-weight:700;font-size:15px}
#scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px}
/* 2 columnas; 8 iconos caben exactamente en pantalla (4 filas); a partir de ahi, scroll */
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-auto-rows:calc((100vh - 56px - 20px - 30px) / 4)}
@supports (height:100dvh){#grid{grid-auto-rows:calc((100dvh - 56px - 20px - 30px) / 4)}}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;border:0;border-radius:20px;background:var(--c,#1f6feb);color:#fff;font-size:26px;font-weight:700;padding:6px 10px;user-select:none;-webkit-user-select:none;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent}
.tab:active{filter:brightness(1.25)}
.tab .ic{font-size:clamp(34px,7vh,60px);line-height:1;height:clamp(38px,8vh,64px);display:flex;align-items:center;justify-content:center}
.tab .ic img{height:100%;max-width:100%;object-fit:contain;border-radius:10px}
.tab .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit .tab{outline:4px dashed #fff8;outline-offset:-6px}
#empty{display:none;text-align:center;color:#8fa3c9;padding:60px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#box{background:#16213a;border-radius:16px;padding:18px;width:min(520px,100%);max-height:94vh;overflow:auto}
#box h3{margin:0 0 12px}
#box label{display:block;font-size:13px;color:#9fb2d8;margin:12px 0 4px}
#box input[type=text],#box input[type=url]{width:100%;padding:12px;border-radius:10px;border:1px solid #2c3d63;background:#0e1730;color:#fff;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.sw.on{border-color:#fff}
#box input[type=color]{width:44px;height:36px;border:0;padding:0;background:none}
.btn{padding:12px 16px;border:0;border-radius:10px;background:#243252;color:#fff;font-size:15px}
.btn.p{background:#1f6feb}.btn.d{background:#b3261e}
.emo{font-size:22px;padding:6px 8px;border-radius:8px;border:0;background:#0e1730}
#prev{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;border-radius:12px;border-bottom:4px solid var(--c);background:var(--c);color:#fff}
#prev .ic img{width:24px;height:24px;object-fit:contain}
.hint{font-size:12px;color:#7f93bb;margin-top:6px}
</style>
</head>
<body>
<div id="top"><h1>🧭 Nav Hub</h1><button class="ctl" id="bAdd" title="Añadir">＋</button><button class="ctl" id="bEdit" title="Modo edición">✎</button><button class="ctl" id="inst">⬇ Instalar</button><button class="ctl" id="bSet" title="Ajustes">⚙</button></div>
<div id="scroll"><div id="grid"></div><div id="empty"><div style="font-size:48px">🧭</div>No hay iconos.<br>Pulsa ＋ para añadir.</div></div>

<div id="modal"><div id="box">
 <h3 id="mt">Editar pestaña</h3>
 <label>Nombre</label><input type="text" id="fn" maxlength="24">
 <label>Dirección (URL)</label><input type="url" id="fu" placeholder="https://..." autocapitalize="off" autocorrect="off">
 <label>Icono</label>
 <div class="row"><input type="text" id="fi" maxlength="4" style="width:80px;text-align:center;font-size:22px" placeholder="🧭">
  <button class="btn" id="fup">📁 Imagen…</button><button class="btn" id="fauto">🌐 Icono de la web</button><button class="btn" id="fclr">✖ Quitar</button></div>
 <input type="file" id="ffile" accept="image/*" hidden>
 <div class="row" style="margin-top:8px" id="emos"></div>
 <label>Color</label>
 <div class="row" id="sws"></div>
 <div class="row" style="margin-top:8px"><input type="color" id="fc"><span class="hint">o elige cualquier color</span></div>
 <div id="prev"><span class="ic" id="pi"></span><span id="pn"></span></div>
 <div class="row" style="margin-top:18px;justify-content:space-between">
  <div class="row"><button class="btn" id="fl">◀</button><button class="btn" id="fr2">▶</button></div>
  <div class="row"><button class="btn d" id="fdel">🗑 Eliminar</button><button class="btn" id="fcan">Cancelar</button><button class="btn p" id="fok">Guardar</button></div>
 </div>
 <div class="hint">◀ ▶ mueven la pestaña de posición.</div>
</div></div>

<div id="modal2" style="position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:21;padding:12px"><div id="box" style="width:min(420px,100%)">
 <h3>Ajustes del Hub</h3>
 <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
  <button class="btn" id="bexp">⬆ Exportar pestañas (copia de seguridad)</button>
  <button class="btn" id="bimp">⬇ Importar pestañas</button>
  <button class="btn d" id="brst">↺ Restaurar pestañas originales</button>
  <button class="btn" id="bcl">Cerrar</button>
 </div>
 <input type="file" id="fimp" accept="application/json" hidden>
 <div class="hint">Las pestañas se guardan en este navegador. Exporta una copia antes de borrar datos del navegador o reinstalar.</div>
</div></div>

<script>
const DEF=[
 {n:'Waze',u:'https://www.waze.com/live-map',c:'#33ccff',i:'🚙'},
 {n:'Google Maps',u:'https://www.google.com/maps',c:'#34a853',i:'📍'},
 {n:'HERE WeGo',u:'https://wego.here.com',c:'#00afaa',i:'🧭'},
 {n:'AutoBoard',u:'https://haymadre9-lab.github.io/Autoboard_V2/',c:'#1f6feb',i:'🚗'},
 {n:'Viajando en Tesla',u:'https://www.viajandoentesla.es/navegador',c:'#e31937',i:'⚡'},
 {n:'Precision Drive',u:'https://drive.precisionautotechnik.com',c:'#8957e5',i:'🎯'},
 {n:'codriver.io',u:'https://codriver.io',c:'#f59e0b',i:'🗺️'},
 {n:'Espejo móvil',u:'',c:'#64748b',i:'📱'}
];
const COLORS=['#1f6feb','#33ccff','#00afaa','#34a853','#f59e0b','#e31937','#d946ef','#8957e5','#64748b','#111827'];
const EMOJIS=['🚗','🚙','⚡','🔋','📍','🧭','🗺️','🎯','📱','🎵','🎬','📺','🅿️','⛽','🌦️','🚦','📡','⭐','🏠','🔧'];
const K='navhub.tabs2';
let T=[],editing=-1,draft=null;
const $=id=>document.getElementById(id);
function load(){
  try{const s=JSON.parse(localStorage.getItem(K)||'null');if(Array.isArray(s)){T=s;return}}catch(e){}
  T=DEF.map(t=>({...t}));
  try{const o=JSON.parse(localStorage.getItem('navhub.tabs')||'null'); // migra URLs editadas antes
    if(Array.isArray(o)&&o.length===DEF.length)o.forEach((x,i)=>{if(x&&typeof x.u==='string')T[i].u=x.u});}catch(e){}
}
function save(){try{localStorage.setItem(K,JSON.stringify(T))}catch(e){alert('No se pudo guardar (almacenamiento lleno o bloqueado)')}}
function iconHTML(i){if(!i)return '';if(/^(data:image|https?:)/.test(i)){const im=document.createElement('img');im.src=i;im.alt='';return im}return i}
function setIcon(el,i){el.textContent='';const v=iconHTML(i);if(typeof v==='string')el.textContent=v;else el.appendChild(v)}
const grid=$('grid'),scr=$('scroll');let modoEdit=false;
function render(){
  grid.textContent='';$('empty').style.display=T.length?'none':'block';scr.classList.toggle('edit',modoEdit);$('bEdit').classList.toggle('on',modoEdit);
  T.forEach((t,i)=>{
    const b=document.createElement('button');b.className='tab';b.style.setProperty('--c',t.c||'#1f6feb');
    const ic=document.createElement('span');ic.className='ic';setIcon(ic,t.i);if(t.i)b.appendChild(ic);
    const n=document.createElement('span');n.className='nm';n.textContent=t.n||'(sin nombre)';b.appendChild(n);
    let tm,long=false;
    b.onclick=()=>{if(long){long=false;return}
      if(modoEdit||!t.u){editar(i);return}
      location.href=t.u;};                       // va directo a la pagina
    b.addEventListener('touchstart',()=>{long=false;tm=setTimeout(()=>{long=true;editar(i)},650)},{passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(tm),{passive:true}));
    b.addEventListener('contextmenu',e=>{e.preventDefault();editar(i)});
    grid.appendChild(b);
  });
}
function abrir(){render()}
$('bAdd').onclick=()=>editar(-1);
$('bEdit').onclick=()=>{modoEdit=!modoEdit;render()};
$('bSet').onclick=()=>$('modal2').style.display='flex';
// ---- editor
function normURL(u){u=u.trim();if(u&&!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return u}
function pintaPrev(){
  $('prev').style.setProperty('--c',draft.c);setIcon($('pi'),draft.i);$('pn').textContent=draft.n||'Nombre';
  [...$('sws').children].forEach(s=>s.classList.toggle('on',s.dataset.c===draft.c));$('fc').value=/^#[0-9a-f]{6}$/i.test(draft.c)?draft.c:'#1f6feb';
  $('fi').value=/^(data:|https?:)/.test(draft.i||'')?'':(draft.i||'');
}
function editar(i){
  editing=i;draft=i>=0?{...T[i]}:{n:'',u:'',c:COLORS[T.length%COLORS.length],i:'⭐'};
  $('mt').textContent=i>=0?'Editar pestaña':'Nueva pestaña';
  $('fn').value=draft.n;$('fu').value=draft.u;
  $('fdel').style.display=i>=0?'':'none';$('fl').style.display=$('fr2').style.display=i>=0?'':'none';
  pintaPrev();$('modal').style.display='flex';
}
function cerrar(){$('modal').style.display='none'}
$('sws').append(...COLORS.map(c=>{const s=document.createElement('button');s.className='sw';s.dataset.c=c;s.style.background=c;s.onclick=()=>{draft.c=c;pintaPrev()};return s}));
$('emos').append(...EMOJIS.map(e=>{const s=document.createElement('button');s.className='emo';s.textContent=e;s.onclick=()=>{draft.i=e;pintaPrev()};return s}));
$('fc').oninput=e=>{draft.c=e.target.value;pintaPrev()};
$('fn').oninput=e=>{draft.n=e.target.value;pintaPrev()};
$('fi').oninput=e=>{draft.i=e.target.value;pintaPrev()};
$('fclr').onclick=()=>{draft.i='';pintaPrev()};
$('fauto').onclick=()=>{try{const h=new URL(normURL($('fu').value)).hostname;if(!h)throw 0;draft.i='https://www.google.com/s2/favicons?domain='+h+'&sz=64';pintaPrev()}catch(e){alert('Escribe primero una URL válida')}};
$('fup').onclick=()=>$('ffile').click();
$('ffile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const s=96,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');const k=Math.min(s/im.width,s/im.height);
  x.drawImage(im,(s-im.width*k)/2,(s-im.height*k)/2,im.width*k,im.height*k);draft.i=cv.toDataURL('image/png');pintaPrev()};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
$('fcan').onclick=cerrar;
$('fok').onclick=()=>{
  draft.n=$('fn').value.trim()||'Pestaña';draft.u=normURL($('fu').value);
  if(editing>=0){T[editing]=draft}else{T.push(draft)}
  save();cerrar();render();
};
$('fdel').onclick=()=>{if(!confirm('¿Eliminar "'+T[editing].n+'"?'))return;T.splice(editing,1);save();cerrar();render()};
function mover(d){const j=editing+d;if(j<0||j>=T.length)return;[T[editing],T[j]]=[T[j],T[editing]];editing=j;save();render()}
$('fl').onclick=()=>mover(-1);$('fr2').onclick=()=>mover(1);
// ---- ajustes
$('bcl').onclick=()=>$('modal2').style.display='none';
$('bexp').onclick=()=>{const b=new Blob([JSON.stringify(T,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='navhub-pestanas.json';a.click()};
$('bimp').onclick=()=>$('fimp').click();
$('fimp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;
  T=a.filter(x=>x&&typeof x==='object').map(x=>({n:String(x.n||''),u:String(x.u||''),c:String(x.c||'#1f6feb'),i:String(x.i||'')}));save();$('modal2').style.display='none';render()}catch(er){alert('Archivo no válido')}};r.readAsText(f);e.target.value=''};
$('brst').onclick=()=>{if(!confirm('Se perderán tus cambios. ¿Restaurar?'))return;T=DEF.map(t=>({...t}));save();$('modal2').style.display='none';render()};
// ---- instalar PWA
let dp=null;
function instalar(){if(!dp)return;dp.prompt();dp.userChoice.finally(()=>{dp=null;$('inst').style.display='none'})}
$('inst').onclick=instalar;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;render()});
addEventListener('appinstalled',()=>{dp=null;render()});
load();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
