<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>AutoBoard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  :root{--txt:#e7eaf0;--dim:#9aa3b2;--bd:#26303f;--ok:#39d98a;--warn:#ff5d5d;}
  *{box-sizing:border-box;} html,body{margin:0;height:100%;background:#05070d;color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif;overflow:hidden;}
  #app{position:fixed;inset:0;display:flex;flex-direction:row;overflow:hidden;background:#05070d;}
  #hudPane{position:relative;flex:0 0 40%;min-width:0;height:100%;overflow:hidden;background:linear-gradient(#0a1526 0%,#0e2038 26%,#0b1322 44%,#070b13 100%);}
  #mapPane{position:relative;flex:1 1 auto;min-width:0;height:100%;overflow:hidden;background:#0a0e17;}
  #divider{flex:0 0 12px;background:#0c1017;cursor:col-resize;display:flex;align-items:center;justify-content:center;z-index:900;touch-action:none;user-select:none;}
  #divider .grip{width:4px;height:52px;border-radius:3px;background:#2a3446;transition:background .15s;}
  #divider:hover .grip,#divider.drag .grip{background:#3ba7ff;}
  body.solo-map #hudPane,body.solo-map #divider{display:none;}
  body.solo-hud #mapPane,body.solo-hud #divider{display:none;}
  body.solo-hud #hudPane{flex:1 1 auto;}
  .ab-modes{position:absolute;z-index:950;top:10px;left:10px;width:192px;display:flex;flex-flow:row wrap;gap:6px;justify-content:center;background:none;border:0;backdrop-filter:none;padding:0;}
  .ab-modes .faro-btn{flex-basis:auto;margin-top:0;}
  .ab-modes button{border:1px solid #1e2836;background:rgba(10,14,20,.7);backdrop-filter:blur(6px);color:#c3ccda;font-weight:700;font-size:12px;padding:6px 0;width:60px;text-align:center;border-radius:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .ab-modes button.on{background:#22d3ee;color:#04141a;}
  .spdmap{position:absolute;z-index:600;top:10px;right:10px;background:rgba(12,16,22,.88);border:1px solid #1e2836;border-radius:14px;padding:7px 16px;display:none;flex-direction:column;align-items:center;line-height:1;}
  .spdmap b{font-size:32px;font-weight:800;color:#eef3fb;}
  .spdmap small{font-size:10px;color:#8b98ad;letter-spacing:2px;margin-top:2px;}
  body.solo-map .spdmap{display:flex;}
  /* ---- AutoBoard: limpieza de iconos y paneles ---- */
  .zoomIn,.zoomOut,.daynight,.refresh,#mic{display:none!important;}
  .gear{right:76px!important;}
  .status{display:none!important;}
  .search{display:none;}
  .trip{bottom:14px!important;left:14px!important;font-size:20px!important;font-weight:800!important;color:#eef3fb!important;background:rgba(8,12,18,.92)!important;border:1px solid #22d3ee!important;border-radius:14px!important;padding:12px 18px!important;box-shadow:0 6px 24px rgba(0,0,0,.55)!important;max-width:72%!important;line-height:1.2!important;letter-spacing:.3px!important;}
  #searchToggle{position:absolute;z-index:720;top:12px;right:12px;width:48px;height:48px;border-radius:50%;background:#2f6bff;border:2px solid rgba(255,255,255,.18);box-shadow:0 3px 12px rgba(0,0,0,.45);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  body.solo-map .spdmap{right:72px!important;}
  .navstack{top:14px!important;z-index:700!important;}
  #map{position:absolute;inset:0;background:#1b1f26;width:100%;height:100%;background:#0a0e17;}
.maplibregl-ctrl-attrib{font-size:9px;opacity:.5;}
.maplibregl-popup-content{background:#fff;color:#111;border-radius:12px;padding:10px 12px;}
.maplibregl-popup-close-button{font-size:18px;padding:0 6px;}
  #hud{position:absolute;inset:0;display:block;background:linear-gradient(#0a1526 0%,#0e2038 26%,#0b1322 44%,#070b13 100%);overflow:hidden;}
  #hudroad{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
  #beams{position:absolute;z-index:2;left:50%;top:26%;width:50%;height:36%;transform:translateX(-50%);transform-origin:50% 100%;display:none;mix-blend-mode:screen;pointer-events:none;}
  #hud.nite #beams{display:block;}
  .beam{position:absolute;bottom:0;left:50%;width:24%;height:100%;background:linear-gradient(to top, rgba(255,244,205,.7), rgba(255,244,205,.06) 62%, transparent);filter:blur(9px);transform-origin:bottom center;border-radius:45% 45% 0 0;}
  .bl{transform:translateX(-50%) rotate(-11deg);} .br{transform:translateX(-50%) rotate(11deg);}
  #hudrain{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;}
  #hud img#hudcar{position:absolute;z-index:3;left:50%;top:60%;transform:translate(-50%,-50%);width:32%;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35));}
  #hudchg{position:absolute;z-index:20;left:10px;top:64px;display:none;flex-direction:column;align-items:flex-start;gap:5px;max-width:78vw;}
  #hudchg .evrow{display:flex;align-items:center;gap:8px;background:rgba(16,18,24,.9);border:1px solid var(--bd);border-radius:11px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;cursor:pointer;}
  #hudchg .evrow img{position:static;transform:none;width:20px;height:20px;filter:none;flex:0 0 auto;}
  #hudchg .evt{overflow:hidden;text-overflow:ellipsis;}
  #hudchg .evstar{display:none;color:#ffd54a;flex:0 0 auto;}
  #hudchg .evrow.isfav{border-color:#ffd54a;background:rgba(58,50,14,.92);}
  #hudchg .evrow.isfav .evstar{display:inline;}
  .mapnight{bottom:10px;right:172px;background:rgba(16,18,24,.85);border:1px solid var(--bd);color:var(--txt);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;}
  #map.nite{filter:brightness(.58) contrast(1.06) saturate(.85);}
  .leaflet-container{background:#0a0e17;}
  #carrot{width:38px;height:38px;}
  .ovl{position:absolute;z-index:500;}
  .modes{top:10px;left:10px;display:flex;gap:6px;background:rgba(16,18,24,.75);border:1px solid var(--bd);border-radius:12px;padding:5px;}
  .modes button{border:0;background:transparent;color:var(--dim);font-weight:800;padding:7px 13px;border-radius:9px;cursor:pointer;font-size:13px;}
  .modes button.on{background:var(--ok);color:#04130c;}
  .search{top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;background:rgba(16,18,24,.85);border:1px solid var(--bd);border-radius:12px;padding:5px;width:min(60vw,430px);}
  .searchrow{display:flex;gap:6px;} .searchrow input{flex:1;background:#0a0d13;border:1px solid var(--bd);border-radius:9px;color:var(--txt);padding:10px 12px;font-size:14px;}
  #favBtn{border:0;background:#1b2130;color:#ffd54a;border-radius:9px;padding:0 12px;cursor:pointer;font-size:16px;}
  #mic{border:0;background:#1b2130;color:#e7eaf0;border-radius:9px;padding:0 11px;cursor:pointer;font-size:16px;}
  #mic.on{background:#3a1616;color:#ff6b6b;}
  #homeBtn{border:0;background:#1b2130;color:#7cc4ff;border-radius:9px;padding:0 13px;cursor:pointer;font-size:21px;}
  .search button#goRoute{border:0;background:var(--ok);color:#04130c;font-weight:800;border-radius:9px;padding:0 16px;cursor:pointer;}
  .suggest{display:none;background:rgba(16,18,24,.97);border:1px solid var(--bd);border-radius:10px;max-height:44vh;overflow:auto;}
  .sug{padding:9px 11px;font-size:13px;color:var(--txt);border-top:1px solid rgba(255,255,255,.06);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .sug:first-child{border-top:0;} .sug span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .sugx{color:var(--dim);padding:0 4px;flex:0 0 auto;}
  .spd{top:10px;right:10px;display:flex;align-items:center;gap:10px;}
  .card{background:rgba(16,18,24,.72);border:1px solid var(--bd);border-radius:14px;padding:9px 13px;text-align:center;}
  .card .n{font-size:44px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;} .card .u{font-size:9px;letter-spacing:.12em;color:var(--dim);}
  .card .n.over{color:var(--warn);}
  .limit{width:74px;height:74px;border-radius:50%;background:#fff;border:9px solid #e01d1d;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5);}
  .limit span{font-size:28px;font-weight:800;color:#111;}
  .reroute{bottom:56px;left:50%;transform:translateX(-50%);background:#ff9a1f;color:#1a1200;border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45);font-size:14px;}
  .trip{bottom:44px;left:10px;font-size:13px;font-weight:700;color:var(--txt);background:rgba(16,18,24,.8);border:1px solid var(--bd);border-radius:10px;padding:7px 11px;}
  .status{bottom:10px;left:10px;font-size:11px;color:var(--dim);background:rgba(16,18,24,.7);border:1px solid var(--bd);border-radius:9px;padding:6px 10px;}
  .rain{bottom:64px;right:10px;background:rgba(16,18,24,.85);border:1px solid var(--bd);color:var(--txt);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;}
  .rain.on{background:#0e2740;color:#7cc4ff;border-color:#7cc4ff;}
  .sound{bottom:10px;right:280px;background:rgba(16,18,24,.85);border:1px solid var(--bd);color:var(--txt);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;}
  .sound.on{background:#173a24;color:#39d98a;border-color:#39d98a;}
  .zoomIn{bottom:76px;right:12px;background:#2a3242;}
  .zoomOut{bottom:76px;right:76px;background:#2a3242;}
  .gear{bottom:12px;right:204px;background:#6a4bd0;}
  #settings{position:absolute;top:0;right:0;width:min(320px,82vw);height:100%;background:rgba(10,12,18,.98);border-left:1px solid var(--bd);z-index:1000;transform:translateX(100%);transition:transform .25s;padding:14px;overflow-y:auto;}
  #settings.open{transform:translateX(0);}
  .shead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin-bottom:12px;color:var(--txt);}
  .shead button{background:none;border:0;color:var(--txt);font-size:20px;cursor:pointer;}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .setbtn{background:#1b2130;border:1px solid var(--bd);color:var(--txt);border-radius:13px;padding:15px 11px;cursor:pointer;font-size:14.5px;font-weight:700;text-align:left;}
  .setbtn.on{background:#173a24;color:#39d98a;border-color:#39d98a;}
  .srow{margin-bottom:12px;} .srow span{font-size:12px;color:var(--dim);display:block;margin-bottom:6px;}
  .segs{display:flex;gap:6px;} .seg{flex:1;background:#1b2130;border:1px solid var(--bd);color:var(--txt);border-radius:9px;padding:9px 4px;cursor:pointer;font-weight:700;font-size:12px;}
  .seg.on{background:#173a24;color:#39d98a;border-color:#39d98a;}
  .refresh{bottom:12px;right:140px;background:#3a4658;}
  .recenter,.daynight,.refresh,.gear,.zoomIn,.zoomOut{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;padding:0;color:#fff;border:2px solid rgba(255,255,255,.18);box-shadow:0 3px 12px rgba(0,0,0,.45);cursor:pointer;}
  .recenter{bottom:12px;right:12px;background:#2f6bff;}
  .daynight{bottom:12px;right:76px;background:#12a89a;}
  .traffic{bottom:10px;right:118px;background:rgba(16,18,24,.85);border:1px solid var(--bd);color:var(--txt);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:15px;}
  .traffic.on{background:var(--ok);}
  .ttwrap{bottom:56px;right:10px;display:none;gap:6px;background:rgba(16,18,24,.9);border:1px solid var(--bd);border-radius:10px;padding:5px;}
  .ttwrap input{background:#0a0d13;border:1px solid var(--bd);border-radius:8px;color:var(--txt);padding:8px;font-size:12px;width:180px;} .ttwrap button{border:0;background:var(--ok);color:#04130c;font-weight:800;border-radius:8px;padding:0 12px;cursor:pointer;}
  .navstack{top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:500;}
  .navbanner{display:none;align-items:center;gap:12px;background:#ffffff;border:2px solid #cfd6e0;border-radius:18px;padding:9px 16px;box-shadow:0 5px 16px rgba(0,0,0,.4);}
  .navbanner.hw{background:#1558d6;border-color:#0d3ea0;}
  .navbanner .navd{font-weight:900;font-size:19px;color:#111;line-height:1;}
  .navbanner.hw .navd{color:#fff;}
  .navbanner .arrow{min-width:58px;height:62px;flex:0 0 auto;} .navbanner .arrow>svg{width:58px;height:62px;display:block;}
  .lanerow{display:flex;gap:2px;align-items:center;height:62px;} .lanerow .lane{width:22px;height:40px;} .lanerow .lane svg{width:100%;height:100%;display:block;}
  .navtext{display:flex;flex-direction:column;} .navd{font-size:30px;font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums;}
  .navsub{font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw;margin-top:3px;font-weight:600;}
  .navbanner.hw .navsub{color:#dbe6ff;}
  .navx{background:transparent;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:0 2px;}
  .lanes{display:none;gap:3px;background:rgba(16,18,24,.92);border:1px solid var(--bd);border-radius:10px;padding:5px 8px;}
  .lanes .lane{width:30px;height:34px;} .lanes .lane svg{width:100%;height:100%;display:block;}
  .navnext2{display:none;align-self:flex-start;align-items:center;gap:8px;background:rgba(16,18,24,.8);border:1px solid var(--bd);border-radius:12px;padding:5px 12px;}
  .navnext2 .arrow2{width:30px;height:32px;flex:0 0 auto;} .navnext2 .arrow2 svg{width:100%;height:100%;display:block;} .nn2txt{font-size:12px;color:var(--dim);}
  .radarsign{position:absolute;left:0;top:0;z-index:600;display:none;flex-direction:column;align-items:center;transform-origin:bottom center;transition:transform .35s linear,left .35s linear,top .35s linear;pointer-events:none;}
  .radarsign.show{display:flex;}
  .rs-c{width:70px;height:70px;border-radius:50%;background:#fff;border:9px solid #e01d1d;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.65);}
  .rs-c span{font-size:28px;font-weight:800;color:#111;} .rs-p{width:6px;height:44px;background:linear-gradient(#9aa1ab,#5c636d);border-radius:3px;margin-top:-2px;}
  .radarsign.nopole .rs-p{display:none;} .radarsign.nopole .rs-d{margin-top:5px;}
  .rs-d{margin-top:3px;background:rgba(14,16,22,.85);border:1px solid var(--bd);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;color:#ffd54a;}
  .radarsign.hot .rs-c{animation:bl .5s infinite;} @keyframes bl{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.65);}50%{box-shadow:0 0 24px 9px rgba(255,45,45,.95);}}
  #radaredge{position:absolute;inset:0;z-index:585;pointer-events:none;display:none;box-shadow:inset 0 0 90px 34px rgba(225,0,0,.85);animation:redpulse 1.4s ease-in-out infinite;}
  #radaredge.show{display:block;} @keyframes redpulse{0%,100%{opacity:.4;}50%{opacity:1;}}
  .leaflet-popup-content{margin:10px 12px;} .pumpico{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
</style></head>
<body>
<div id="app">
  <div id="hudPane">
  <div id="hud">
    <canvas id="hudroad"></canvas>
    <div id="beams"><div class="beam bl"></div><div class="beam br"></div></div>
    <img id="hudcar" alt="">
    <canvas id="hudrain"></canvas>
  </div>
  <div id="hudchg" style="display:none"></div>
  <div class="ovl spd" id="spdHud"><div class="limit" id="limit" style="display:none"><span id="limitn">--</span></div><div class="card"><div class="n" id="spd">0</div><div class="u">KM/H</div></div></div>
  </div>
  <div id="divider"><div class="grip"></div></div>
  <div id="mapPane">
  <div id="map"></div>
  <div class="spdmap"><b id="spd2">0</b><small>KM/H</small></div>

  <div class="ovl modes"><button id="mMap" class="on">Mapa</button><button id="mHud">HUD</button></div>
  <div class="ovl search" id="searchBar">
    <div class="searchrow"><button id="homeBtn" title="Casa (mantén pulsado para fijar)">🏠</button><input id="dest" type="text" placeholder="¿A dónde vamos?" autocomplete="off"><button id="mic" title="Buscar por voz">🎤</button><button id="favBtn" title="Favoritos">⭐</button><button id="goRoute">Ir</button></div>
    <div class="suggest" id="suggest"></div>
  </div>
  <div class="ovl ttwrap" id="ttWrap"><input id="ttKey" type="text" placeholder="Clave TomTom (tráfico)" autocomplete="off"><button id="ttSave">Guardar</button></div>

  <div class="ovl trip" id="trip" style="display:none"></div>
  <div class="ovl status" id="status">Buscando GPS…</div>
  <button class="ovl daynight" id="daynight">🌙</button>
  <button class="ovl refresh" id="refresh" title="Actualizar mapa">🔄</button>
  <button class="ovl gear" id="gear" title="Ajustes">⚙️</button>
  <button class="ovl zoomIn" id="zoomIn" title="Acercar">➕</button>
  <button class="ovl zoomOut" id="zoomOut" title="Alejar">➖</button>
  <button class="ovl recenter" id="recenter">🎯</button>
  <div id="settings">
    <div class="shead"><span>Ajustes</span><button id="setClose">✕</button></div>
    <div class="sgrid">
      <button class="setbtn" id="mapnight">🌙 Noche</button>
      <button class="setbtn" id="sound">🔇 Sonido</button>
      <button class="setbtn" id="rain">🌧️ Lluvia</button>
      <button class="setbtn" id="traffic">🚦 Tráfico</button>
      <button class="setbtn on" id="setTilt">📐 Inclinación</button>
      <button class="setbtn on" id="setRadar">📷 Radares</button>
      <button class="setbtn on" id="setChargers">⚡ Cargadores</button>
      <button class="setbtn on" id="setEvList">📋 Lista EV</button>
    </div>
    <div class="srow"><span>Tipo de ruta</span>
      <div class="segs"><button class="seg on" data-rt="fastest">Rápida</button><button class="seg" data-rt="shortest">Corta</button><button class="seg" data-rt="eco">Eco</button></div>
    </div>
    <div class="srow"><span>Evitar</span>
      <div class="sgrid"><button class="setbtn" id="avoidTolls">🚫 Peajes</button><button class="setbtn" id="avoidMotorways">🚫 Autovías</button><button class="setbtn" id="avoidFerries">🚫 Ferris</button></div>
    </div>
    <div class="srow"><span>Potencia mínima de cargadores</span>
      <div class="segs"><button class="seg on" data-kw="0">Todos</button><button class="seg" data-kw="50">50+ kW</button><button class="seg" data-kw="150">150+ kW</button></div>
    </div>

      <div style="display:flex;gap:6px"><input id="syncpin" placeholder="Tu PIN" autocomplete="off" style="flex:1;background:#12161f;border:1px solid var(--bd);color:var(--txt);border-radius:9px;padding:9px 10px;font-size:13px"><button class="setbtn" id="syncBtn" style="text-align:center;flex:0 0 auto">Aplicar</button></div>

  <div class="radarsign" id="radarsign"><div class="rs-c"><span id="rsmax">80</span></div><div class="rs-p"></div><div class="rs-d" id="rsdist">500 m</div></div>
  </div>
</div>

<script>
/* ---- Forzar actualizacion del service worker -----------------------------
   El SW cachea con el nombre 'teslanav-v61', el MISMO que usa Tesla Nav, y
   ambas apps comparten origen: se pisan los archivos entre ellas. Aqui se
   borran los caches con nombre ajeno, se pide actualizacion al SW y, si entra
   uno nuevo, se recarga una sola vez. Asi deja de servir versiones viejas.   */
(function(){
  const MIO = 'autoboard';          // los caches que NO empiecen asi, se borran
  if(!('serviceWorker' in navigator)) return;
  addEventListener('load', async () => {
    try{
      if(window.caches){
        const ns = await caches.keys();
        for(const n of ns) if(n.indexOf(MIO)!==0){ await caches.delete(n); console.log('[sw] cache ajeno borrado:', n); }
      }
      const rs = await navigator.serviceWorker.getRegistrations();
      for(const r of rs){
        r.update();
        r.addEventListener('updatefound', () => {
          const nuevo = r.installing;
          if(!nuevo) return;
          nuevo.addEventListener('statechange', () => {
            if(nuevo.state==='installed' && navigator.serviceWorker.controller
               && !sessionStorage.getItem('swRecargado')){
              sessionStorage.setItem('swRecargado','1');
              console.log('[sw] version nueva instalada; recargando');
              location.reload();
            }
          });
        });
      }
    }catch(e){ console.warn('[sw]', e.message); }
  });
})();

<script>
(function(){
  let cargando=false;
  function abrirConsola(){
    if(cargando||window.eruda) { if(window.eruda) eruda.show(); return; }
    cargando=true;
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/eruda';
    s.onload=()=>{ try{ eruda.init(); eruda.show(); }catch(e){} };
    s.onerror=()=>{ cargando=false; alert('No se pudo cargar la consola (sin conexion)'); };
    document.head.appendChild(s);
  }
  window.abrirConsola=abrirConsola;
  if(/[?&]debug=1/.test(location.search)) addEventListener('DOMContentLoaded',abrirConsola);
  addEventListener('DOMContentLoaded',()=>{
    const st=document.getElementById('status'); if(!st) return;
    let n=0,t0=0;
    st.addEventListener('click',()=>{
      const ahora=Date.now();
      n=(ahora-t0<900)?n+1:1; t0=ahora;
      if(n>=5){ n=0; abrirConsola(); }
    });
  });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>
/* ================= Adaptador MapLibre (emula la API de Leaflet que usa la app) ================= */
/* v2: teselas VECTORIALES (MapTiler) + giro/inclinación nativos en GPU. */
const MAPTILER_KEY="sG00UkBX9Ig2ifguvPgU"; // <-- restríngela por dominio en MapTiler al publicar
const MT_STYLES={
  sat:  'https://api.maptiler.com/maps/hybrid/style.json?key='+MAPTILER_KEY,
  day:  'https://api.maptiler.com/maps/streets-v2/style.json?key='+MAPTILER_KEY,
  night:'https://api.maptiler.com/maps/streets-v2-dark/style.json?key='+MAPTILER_KEY
};
(function(){
  let uid=0;
  const D2=([la,lo])=>[lo,la]; // Leaflet [lat,lng] -> MapLibre [lng,lat]

  class MapWrap{
    constructor(el,opts){
      // Base VECTORIAL por defecto (streets-v2). No se pixela a ningun zoom, pesa
      // 4-5 veces menos que el satelite raster y se sube a la GPU una sola vez
      // como geometria. El satelite sigue disponible con el boton 🛰️.
      const _h=new Date().getHours(), _ini=(_h>=21||_h<7)?MT_STYLES.night:MT_STYLES.day;
      this._m=new maplibregl.Map({container:el, style:_ini, center:[-2.93,43.26], zoom:16,
        attributionControl:{compact:true}, dragRotate:false, pitchWithRotate:false, keyboard:false, fadeDuration:0, dragPan:true});
      try{ this._m.touchZoomRotate.disableRotation(); }catch(e){}
      try{ this._m.setMaxPitch(70); }catch(e){}
      this.raw=this._m; this.ready=false; this.q=[]; this._overlays=[]; this._polys=[]; this._baseKey=(new Date().getHours()>=21||new Date().getHours()<7)?'night':'day';
      this._m.on('load',()=>{ this.ready=true; this.q.forEach(f=>{try{f();}catch(e){}}); this.q=[]; });
      this._m.on('style.load',()=>{ this._reAdd(); }); // tras setStyle: re-añade overlays y rutas
    }
    run(f){ if(this.ready && this._m.isStyleLoaded()){ try{f();}catch(e){} } else this.q.push(f); }
    _reAdd(){ this._overlays.forEach(o=>this._mountOverlay(o)); this._polys.forEach(p=>this._mountPoly(p)); }
    // ---- cámara / métodos Leaflet ----
    setView(ll,z,o){ this.run(()=>this._m.jumpTo({center:D2(ll), zoom:(z!=null?z:this._m.getZoom())})); return this; }
    setZoom(z){ this.run(()=>this._m.setZoom(z)); return this; }
    getZoom(){ return this._m.getZoom(); }
    getCenter(){ const c=this._m.getCenter(); return {lat:c.lat,lng:c.lng}; }
    invalidateSize(){ try{this._m.resize();}catch(e){} return this; }
    closePopup(p){ if(p&&p.remove)p.remove(); }
    hasLayer(l){ return !!(l&&l._added); }
    removeLayer(l){ if(l&&l._remove)l._remove(); }
    on(evt,cb){
      const map=this._m;
      if(evt==='contextmenu'){ map.on('contextmenu',e=>cb({latlng:{lat:e.lngLat.lat,lng:e.lngLat.lng}})); }
      else if(evt==='dragstart'){ map.on('dragstart',()=>cb()); } // SOLO arrastre real del usuario (no el giro programático)
      else if(evt==='dragend'){ map.on('dragend',()=>cb()); }
      else if(evt==='zoomstart'){ map.on('zoomstart',()=>cb()); }
      else if(evt==='zoomend'){ map.on('zoomend',()=>cb()); }
      else { map.on(evt,cb); }
      return this;
    }
    // ---- base por setStyle (satélite/día/noche) ----
    _setBase(url){ this.run(()=>this._m.setStyle(url)); }
    // ---- overlays raster (tráfico, lluvia) ----
    _addOverlay(o){ o._map=this; this._overlays.push(o); o._added=true; this.run(()=>this._mountOverlay(o)); }
    _mountOverlay(o){ const m=this._m; try{ if(!m.getSource(o.id)) m.addSource(o.id,{type:'raster',tiles:[o.url],tileSize:256}); if(!m.getLayer(o.id)) m.addLayer({id:o.id,type:'raster',source:o.id,paint:{'raster-opacity':(o.opts.opacity!=null?o.opts.opacity:1)}}); }catch(e){} }
    _removeOverlay(o){ o._added=false; this._overlays=this._overlays.filter(x=>x!==o); const m=this._m; try{ if(m.getLayer(o.id))m.removeLayer(o.id); if(m.getSource(o.id))m.removeSource(o.id); }catch(e){} }
    _refreshOverlay(o){ const m=this._m; try{ const s=m.getSource(o.id); if(s&&s.setTiles)s.setTiles([o.url]); }catch(e){} }
    _overlayToFront(o){ try{ if(this._m.getLayer(o.id))this._m.moveLayer(o.id); }catch(e){} }
    // ---- polilíneas (ruta) como GeoJSON ----
    _addPoly(p){ p._map=this; this._polys.push(p); p._added=true; this.run(()=>this._mountPoly(p)); }
    _mountPoly(p){ const m=this._m; const gj={type:'Feature',geometry:{type:'LineString',coordinates:(p.coords||[]).map(D2)}};
      try{ if(!m.getSource(p.id)) m.addSource(p.id,{type:'geojson',data:gj}); else m.getSource(p.id).setData(gj);
        if(!m.getLayer(p.id)) m.addLayer({id:p.id,type:'line',source:p.id,layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':p.opts.color||'#4c8dff','line-width':p.opts.weight||6,'line-opacity':(p.opts.opacity!=null?p.opts.opacity:1)}}); }catch(e){} }
    _updatePoly(p){ const m=this._m; try{ const s=m.getSource(p.id); if(s)s.setData({type:'Feature',geometry:{type:'LineString',coordinates:(p.coords||[]).map(D2)}}); }catch(e){} }
    _polyToFront(p){ try{ if(this._m.getLayer(p.id))this._m.moveLayer(p.id); }catch(e){} }
    _removePoly(p){ p._added=false; this._polys=this._polys.filter(x=>x!==p); const m=this._m; try{ if(m.getLayer(p.id))m.removeLayer(p.id); if(m.getSource(p.id))m.removeSource(p.id); }catch(e){} }
  }

  class TileOverlay{ constructor(url,opts){ this.url=url; this.opts=opts||{}; this.id='ovl_'+(++uid); this._added=false; }
    addTo(map){ map._addOverlay(this); return this; }
    _remove(){ if(this._map)this._map._removeOverlay(this); }
    redraw(){ if(this._map)this._map._refreshOverlay(this); }
    setUrl(u){ this.url=u; if(this._map)this._map._refreshOverlay(this); }
    bringToFront(){ if(this._map)this._map._overlayToFront(this); }
    on(){ return this; }
  }
  class Poly{ constructor(latlngs,opts){ this.coords=latlngs||[]; this.opts=opts||{}; this.id='poly_'+(++uid); this._added=false; }
    addTo(map){ map._addPoly(this); return this; }
    setLatLngs(a){ this.coords=a||[]; if(this._map)this._map._updatePoly(this); return this; }
    bringToFront(){ if(this._map)this._map._polyToFront(this); return this; }
    _remove(){ if(this._map)this._map._removePoly(this); }
  }
  class Group{ constructor(){ this._isGroup=true; this.items=[]; this._map=null; this._added=false; }
    addTo(map){ this._map=map; this._added=true; this.items.forEach(m=>m._attach(map)); return this; }
    add(m){ this.items.push(m); if(this._map)m._attach(this._map); }
    clearLayers(){ this.items.forEach(m=>m._detach()); this.items=[]; }
    on(){ return this; }
  }
  class Mk{ constructor(latlng,opts){ this.ll=latlng; this.opts=opts||{}; const spec=this.opts.icon;
      const el=document.createElement('div'); el.style.lineHeight='0'; el.style.cursor=(this.opts.interactive===false?'default':'pointer');
      if(spec){ el.innerHTML=spec.html||''; if(spec.size){ el.style.width=spec.size[0]+'px'; el.style.height=spec.size[1]+'px'; } }
      this.el=el; this._icon=el; this._added=false;
      if(this.opts.interactive!==false){ // que el toque/clic sobre el marcador NO llegue al mapa (si llega, MapLibre lo trata como clic y cierra la ficha)
        const stop=e=>e.stopPropagation();
        el.addEventListener('touchstart',stop,{passive:true}); el.addEventListener('pointerdown',stop); el.addEventListener('mousedown',stop); el.addEventListener('click',stop);
      }
      this._mk=new maplibregl.Marker({element:el, anchor:'center'}).setLngLat(D2(latlng));
    }
    _attach(map){ if(!this._added){ this._map=map; this._mk.addTo(map._m); this._added=true; } }
    _detach(){ if(this._added){ this._mk.remove(); this._added=false; } }
    addTo(target){ if(target && target._isGroup){ target.add(this); } else { this._attach(target); } return this; }
    setLatLng(a){ this.ll=a; this._mk.setLngLat(D2(a)); return this; }
    on(evt,cb){ this.el.addEventListener(evt,cb); return this; }
    remove(){ this._detach(); return this; }
  }
  class Popup{ constructor(opts){ this._p=new maplibregl.Popup({maxWidth:((opts&&opts.maxWidth)||280)+'px', closeButton:true, closeOnClick:true}); }
    setLatLng(a){ this._ll=D2(a); return this; }
    setContent(el){ this._content=el; return this; }
    openOn(map){ this._p.setLngLat(this._ll).setDOMContent(this._content).addTo(map._m); return this; }
    remove(){ this._p.remove(); }
  }

  window.L={
    map:(id,opts)=>new MapWrap(id,opts),
    tileLayer:(url,opts)=>new TileOverlay(url,opts),
    marker:(ll,opts)=>new Mk(ll,opts),
    divIcon:(o)=>({html:(o&&o.html)||'', size:(o&&o.iconSize)||[24,24], anchor:(o&&o.iconAnchor)||null}),
    layerGroup:()=>new Group(),
    polyline:(ll,opts)=>new Poly(ll,opts),
    popup:(opts)=>new Popup(opts),
    control:{ attribution:()=>({ addAttribution:()=>({ addTo:()=>{} }) }) }
  };
})();
</script>

function hudPaneSize(){ const p=document.getElementById('hudPane'); return {w:(p&&p.clientWidth)||window.innerWidth, h:(p&&p.clientHeight)||window.innerHeight}; }

function hprojY(z,horizon,H){ return horizon + (H-horizon)*(1/(1+z*0.06)); }

let rainDrops=null, rainWasOn=false, hudSpeckles=null, splash=[];
function initHudSpeckles(){ hudSpeckles=[]; for(let i=0;i<1100;i++) hudSpeckles.push({u:Math.random(),z:Math.random()*130,s:0.6+Math.random()*1.6,d:Math.random()<0.55}); }
function initRain(){ rainDrops=[]; for(let i=0;i<110;i++) rainDrops.push({x:Math.random(),y:Math.random(),l:0.02+Math.random()*0.05,s:0.7+Math.random()*0.9}); }
function drawHudRain(dt){ const cv=document.getElementById('hudrain'); if(!cv)return; {const s=hudPaneSize(); if(cv.width!==s.w||cv.height!==s.h){cv.width=s.w||1;cv.height=s.h||1;}} const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; if(!rainDrops)initRain();
  ctx.clearRect(0,0,W,H); ctx.strokeStyle='rgba(180,200,230,.45)'; ctx.lineWidth=1.5; const slant=0.16;
  for(const d of rainDrops){ d.y+=d.s*dt*1.7; d.x+=slant*d.s*dt*0.3; if(d.y>1.05){ d.y=-0.05; d.x=Math.random(); } const x=d.x*W,y=d.y*H,len=d.l*H; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-slant*len,y+len); ctx.stroke(); }
  // salpicadura de ruedas al circular con lluvia
  const carY=0.685*H, cx=(hudLineX?hudLineX(W*0.5,carY):W*0.5);
  if(speedKmh>15 && splash.length<180){ const n=Math.min(5,1+Math.round(speedKmh/28)); for(let k=0;k<n;k++){ for(const side of [-1,1]){ splash.push({x:cx+side*W*0.095,y:carY,vx:side*(8+Math.random()*28),vy:-(16+Math.random()*42),life:0.38+Math.random()*0.32,t:0,sz:1+Math.random()*1.8}); } } }
  for(let i=splash.length-1;i>=0;i--){ const p=splash[i]; p.t+=dt; if(p.t>=p.life){ splash.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=280*dt; const a=(1-p.t/p.life)*0.5; ctx.fillStyle='rgba(205,218,238,'+a.toFixed(3)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill(); }
  rainWasOn=true;
}
function clearHudRain(){ if(!rainWasOn)return; const cv=document.getElementById('hudrain'); if(cv&&cv.width){ cv.getContext('2d').clearRect(0,0,cv.width,cv.height); } rainWasOn=false; }
function drawHudRoundabout(cx,cy,rx,ry,exit){
  hctx.lineCap='round'; hctx.lineJoin='round';
  hctx.strokeStyle='#ffffff'; hctx.lineWidth=3; hctx.beginPath(); hctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); hctx.stroke();
  const G='#3ee07b'; hctx.strokeStyle=G; hctx.lineWidth=Math.max(5,rx*0.22);
  hctx.beginPath(); hctx.moveTo(cx, cy+ry+ry*0.9); hctx.lineTo(cx, cy+ry); hctx.stroke();
  const ex=Math.min(4,Math.max(1,exit||1)); let arrowAng;
  if(ex>=4){ hctx.beginPath(); hctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); hctx.stroke(); arrowAng=Math.PI/2; }
  else { const end=Math.PI/2 - ex*(Math.PI/2); hctx.beginPath(); hctx.ellipse(cx,cy,rx,ry,0,Math.PI/2,end,true); hctx.stroke(); arrowAng=end; }
  const px=cx+rx*Math.cos(arrowAng), py=cy+ry*Math.sin(arrowAng);
  const sx=cx+(rx+rx*0.55)*Math.cos(arrowAng), sy=cy+(ry+ry*0.55)*Math.sin(arrowAng);
  const tx=cx+(rx+rx*1.35)*Math.cos(arrowAng), ty=cy+(ry+ry*1.35)*Math.sin(arrowAng);
  hctx.beginPath(); hctx.moveTo(px,py); hctx.lineTo(sx,sy); hctx.stroke();
  const ang=Math.atan2(ty-py,tx-px), hw=Math.max(9,rx*0.7);
  hctx.fillStyle=G; hctx.beginPath(); hctx.moveTo(tx,ty);
  hctx.lineTo(sx-Math.cos(ang+Math.PI/2)*hw, sy-Math.sin(ang+Math.PI/2)*hw);
  hctx.lineTo(sx-Math.cos(ang-Math.PI/2)*hw, sy-Math.sin(ang-Math.PI/2)*hw);
  hctx.closePath(); hctx.fill();
}
function drawHudRoad(phase,bend,rnd,exit){
  bend=bend||0; rnd=rnd||0;
  const W=hudcv.width,H=hudcv.height; const horizon=H*0.34, vpx=W*0.5+bend*W*0.36, blX=W*0.10, brX=W*0.90;
  hctx.clearRect(0,0,W,H);
  // curva: desplazamiento lateral según profundidad (más fuerte a lo lejos)
  function bendX(fr){ return bend*W*0.20*(fr*fr); }
  function lineX(bx,y){ const fr=(H-y)/(H-horizon); return bx+(vpx-bx)*fr+bendX(fr); }
  hudLineX=lineX;
  // asfalto siguiendo la curva (varias franjas)
  hctx.beginPath(); hctx.moveTo(blX,H);
  for(let fr=0;fr<=1.001;fr+=0.1){ const y=H-(H-horizon)*fr; hctx.lineTo(lineX(blX,y),y); }
  for(let fr=1;fr>=0;fr-=0.1){ const y=H-(H-horizon)*fr; hctx.lineTo(lineX(brX,y),y); }
  hctx.closePath();
  const g=hctx.createLinearGradient(0,horizon,0,H); g.addColorStop(0,'#151b25'); g.addColorStop(1,'#2c3340'); hctx.fillStyle=g; hctx.fill();
  if(!hudSpeckles)initHudSpeckles();
  hctx.save(); hctx.clip();
  for(const sp of hudSpeckles){ let z=((sp.z - phase)%130+130)%130; const y=hprojY(z,horizon,H); if(y<=horizon+3)continue;
    const fr=(H-y)/(H-horizon); const lx=lineX(blX,y), rx2=lineX(brX,y); const x=lx+sp.u*(rx2-lx);
    const sz=Math.max(0.6, sp.s*(0.35+1.3*(1-fr))); hctx.fillStyle=sp.d?'rgba(0,0,0,.28)':'rgba(255,255,255,.08)';
    hctx.fillRect(x-sz/2,y-sz/2,sz,sz); }
  hctx.restore();
  function dashes(bx,color,wNear){ hctx.fillStyle=color; const period=13, dash=6.5;
    for(let z=-(phase%period); z<130; z+=period){ const zn=Math.max(0,z), zf=z+dash; if(zf<=0)continue;
      const y1=hprojY(zn,horizon,H), y2=hprojY(zf,horizon,H); if(y1<=horizon)continue;
      const fr=(H-y1)/(H-horizon); const w=wNear*(0.07+0.93*(1-fr));
      const x1=lineX(bx,y1), x2=lineX(bx,y2);
      hctx.beginPath(); hctx.moveTo(x1-w/2,y1); hctx.lineTo(x1+w/2,y1); hctx.lineTo(x2+w*0.5,y2); hctx.lineTo(x2-w*0.5,y2); hctx.closePath(); hctx.fill();
    }
  }
  dashes(blX+W*0.06,'#ffffff',8); dashes(brX-W*0.06,'#ffffff',8);
  // rotonda acercándose
  if(rnd>0){ const cy=horizon+(H-horizon)*(0.12+0.62*rnd); const cx=lineX((blX+brX)/2,cy); const rr=(0.05+0.17*rnd)*H; drawHudRoundabout(cx,cy,rr,rr*0.55,exit); }
}

    }).join('');

      // Como la camara del mapa usa disp.head como bearing, ese temblor se ve en
      // las flechas. Se suaviza mas, y por debajo de 2 m/s se congela del todo.
      // Aun temblaba: se sube el umbral a 3 m/s y se suaviza mas todavia. Por
      // debajo de esa velocidad el rumbo del receptor es practicamente ruido.
      if(raw.spd>3) disp.head=angLerp(disp.head,raw.head,Math.min(1,dt*0.9));

        // cuantizado a 0.25 grados: por debajo de eso solo es ruido del GPS y
        // obliga al mapa a repintar las etiquetas y flechas sin motivo

    const pedir=async (n,comp,ms)=>{

    const url='https://api.tomtom.com/routing/1/calculateRoute/'+locs+'/json?key='+TT+'&traffic=true&travelMode=car&routeType='+routeType+'&sectionType=traffic&computeTravelTimeFor=all&maxAlternatives=2&instructionsType=text&language=es-ES'+av.map(a=>'&avoid='+a).join('');
    const r=await fetch(url); const j=await r.json();
    if(!j.routes||!j.routes.length){ $('status').textContent='Sin ruta'; return; }
    destLL=pts[pts.length-1]; routeOn=true; offAcc=0;
    try{ publishRoute(destLL, ($('dest')&&$('dest').value)||''); }catch(e){} // compartir destino con el otro dispositivo
    const routes=j.routes; applyRoute(routes[0]);
    let bestAlt=null; for(let i=1;i<routes.length;i++){ if(!bestAlt||routes[i].summary.travelTimeInSeconds<bestAlt.summary.travelTimeInSeconds)bestAlt=routes[i]; }
    const rr=$('reroute');
    if(bestAlt && (routes[0].summary.travelTimeInSeconds - bestAlt.summary.travelTimeInSeconds)>60){ const save=Math.round((routes[0].summary.travelTimeInSeconds-bestAlt.summary.travelTimeInSeconds)/60); rr._alt=bestAlt; rr.textContent='⚠ Evitar atasco · −'+save+' min'; rr.style.display='block'; }
    else { rr.style.display='none'; rr._alt=null; }
    $('searchBar').style.display='none'; $('navbanner').style.display='flex'; hideSuggest();
  }catch(e){ $('status').textContent='Error de ruta'; }
}
/* Ultimos destinos: se guardan al lanzar la ruta y se ofrecen al tocar el
   buscador, antes de escribir nada. Evita teclear conduciendo lo que ya has
   usado, sin tener que crear un favorito.                                     */
function getRecientes(){ try{ return JSON.parse(localStorage.getItem('recientes')||'[]'); }catch(e){ return []; } }
function addReciente(ll, nombre){
  try{
    if(!ll || !isFinite(ll[0])) return;
    const n=(nombre||'').trim() || (ll[0].toFixed(4)+', '+ll[1].toFixed(4));
    let r=getRecientes().filter(x => dist([x.lat,x.lon], ll) > 120);   // no duplicar
    r.unshift({name:n.slice(0,60), lat:ll[0], lon:ll[1], t:Date.now()});
    localStorage.setItem('recientes', JSON.stringify(r.slice(0,5)));
  }catch(e){}
}
async function routeTo(dest, nombre){ if(!raw){ $('status').textContent='Sin GPS todavía'; return; }
  addReciente(dest, nombre || $('dest').value);
  buildRoute([[raw.lat,raw.lon],dest]); }
function addWaypoint(ll){ if(!raw)return; if(routeOn&&destLL) buildRoute([[raw.lat,raw.lon],ll,destLL]); else routeTo(ll); }
function renderStep(say){ const s=steps[stepIdx]; if(!s)return; const hw=isHighway(s); $('navbanner').classList.toggle('hw',hw); $('arrow').innerHTML=maneuverSVG(s,hw); $('navsub').textContent=s.name||shortHint(s); if(say)speak(s.instr);
  const nx=steps[stepIdx+1]; if(nx){ $('navnext2').style.display='flex'; $('arrow2').innerHTML=maneuverSVG(nx,isHighway(nx)); $('nn2txt').textContent='Luego · '+shortHint(nx); } else $('navnext2').style.display='none'; }
function endRoute(){ routeOn=false; steps=[]; osrmLanes=[]; hudTurnDist=null; hideLanes(); clearRoute(); $('navbanner').style.display='none'; $('navnext2').style.display='none'; $('trip').style.display='none'; $('searchBar').style.display='flex'; }
function trackRoute(){ if(!routeOn||!disp||!steps.length)return; trimRoute();
  const here=[disp.lat,disp.lon]; let s=steps[stepIdx]; let d=dist(here,s.ll); s._min=Math.min(s._min,d);
  // fuera de ruta -> recalcular
  let dr=1e9; for(let i=1;i<routeCoordsLL.length;i+=2){ const dd=dist(here,routeCoordsLL[i]); if(dd<dr)dr=dd; }
  if(dr>70)offAcc++; else offAcc=0;
  if(offAcc>3 && performance.now()-lastRecalc>8000){ lastRecalc=performance.now(); offAcc=0; speak('Recalculando ruta'); routeTo(destLL); return; }
  if(!s._v && d<320 && d>70){ s._v=true; speak('En '+fmtDist(d)+', '+s.instr); }
  const thr=Math.max(20,(raw.spd||0)*1.4); const passed=s._min<55&&d>s._min+15;
  if((d<thr||passed)&&stepIdx<steps.length-1){ stepIdx++; renderStep(true); s=steps[stepIdx]; d=dist(here,s.ll); }
  const hw=isHighway(s); $('navbanner').classList.toggle('hw',hw); hudTurnType=(s.maneuver||{}).type; hudTurnMod=(s.maneuver||{}).modifier; hudTurnDist=d; hudTurnExit=(s.maneuver||{}).exit||1; const lanes=(d<600)?laneFor(s.ll):null; $('arrow').innerHTML = lanes? lanesHTML(lanes,hw) : maneuverSVG(s,hw);
  $('navdist').textContent='En '+fmtDist(d);
  let rem=0; for(let i=stepIdx;i<steps.length;i++) rem+=steps[i].distance; const mins=Math.max(1,Math.round(rem/(Math.max(8,speedKmh)/3.6)/60)); const eta=new Date(Date.now()+mins*60000);
  const tp=$('trip'); tp.style.display='block'; tp.textContent=fmtDist(rem)+' · '+(mins>=60?Math.floor(mins/60)+' h '+(mins%60)+' min':mins+' min')+' · llegada '+eta.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  if(stepIdx===steps.length-1 && dist(here,destLL)<40){ speak('Has llegado a tu destino'); endRoute(); }
}

const SYNC_ID='dev_'+Math.random().toString(36).slice(2)+'_'+Date.now();
let lastRouteTs=Date.now();   // solo reacciona a rutas puestas DESPUÉS de abrir

function publishRoute(dest,name){
  if(applyingRemote){ applyingRemote=false; return; }   // no re-publicar una ruta que vino del otro (evita eco)
  const pin=_syncPin(); if(!pin||!dest) return; const ts=Date.now(); lastRouteTs=ts;
  try{ fetch(SUPA_URL+'configs',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({pin:pin+'~route', data:{lat:dest[0],lon:dest[1],name:name||'',ts,src:SYNC_ID}, updated_at:new Date(ts).toISOString()})}); }catch(e){}
}
async function pollRoute(){
  const pin=_syncPin(); if(!pin) return;
  try{ const r=await fetch(SUPA_URL+'configs?pin=eq.'+encodeURIComponent(pin+'~route')+'&select=data',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    const j=await r.json(); const d=j&&j[0]&&j[0].data; if(!d||d.lat==null) return;
    if(d.ts>lastRouteTs && d.src!==SYNC_ID && raw){ lastRouteTs=d.ts; applyingRemote=true; routeTo([d.lat,d.lon]); $('status').textContent='📲 Ruta sincronizada'; if(d.name&&$('dest'))$('dest').value=d.name; }

$('mHud').onclick=()=>{ hudOn=true; $('map').style.display='none'; $('hud').style.display='block'; $('mHud').classList.add('on'); $('mMap').classList.remove('on'); updateHudCar(); };

  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

<script>
/* ===== AutoBoard: pantalla partida estilo Android Auto ===== */
(function(){
  const LS={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
  const app=document.getElementById('app'), hudPane=document.getElementById('hudPane'), divider=document.getElementById('divider');
  const oldModes=document.querySelector('.ovl.modes'); if(oldModes) oldModes.style.display='none';

  const bar=document.createElement('div'); bar.className='ab-modes';
  bar.innerHTML='<button data-m="hud">HUD 2</button><button data-m="split" class="on">Split</button><button data-m="map">Mapa</button><button data-m="faro" class="faro-btn">Faro</button>';
  app.appendChild(bar);

  function relayout(){
    try{ if(typeof map!=='undefined'&&map&&map.invalidateSize) map.invalidateSize(false); }catch(e){}
    try{ if(typeof hudResize==='function') hudResize(); }catch(e){}
    try{ if(typeof updateHudCar==='function') updateHudCar(); }catch(e){}
  }
  function savedSplitPct(){ const sp=parseFloat(LS.get('abSplit')); return (sp>=22&&sp<=78)?sp:40; }
  function setMode(m){
    document.body.classList.remove('solo-map','solo-hud','faro');
    if(m==='map'){ document.body.classList.add('solo-map'); }
    else if(m==='hud'){ document.body.classList.add('solo-hud'); hudPane.style.flex='1 1 auto'; }
    else if(m==='faro'){ document.body.classList.add('faro'); }
    else { hudPane.style.flex='0 0 '+savedSplitPct()+'%'; }
    try{ hudOn = (m!=='map' && m!=='faro'); if(typeof updateHudCar==='function') updateHudCar(); }catch(e){}
    try{ if(window.hud2){ hudOn ? hud2.abrir() : hud2.cerrar(); } }catch(e){}
    bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    LS.set('abMode',m);
    requestAnimationFrame(()=>{ relayout(); setTimeout(relayout,70); setTimeout(relayout,220); });
  }
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  try{ const mm=document.getElementById('mMap'),mh=document.getElementById('mHud'); if(mm)mm.onclick=()=>setMode('map'); if(mh)mh.onclick=()=>setMode('hud'); }catch(e){}

  let dragging=false;
  function pct(x){ const r=app.getBoundingClientRect(); return Math.max(22,Math.min(78,(x-r.left)/r.width*100)); }
  function applyPct(p){ hudPane.style.flex='0 0 '+p+'%'; LS.set('abSplit',p); relayout(); }
  divider.addEventListener('mousedown',e=>{e.preventDefault();dragging=true;divider.classList.add('drag');});
  window.addEventListener('mousemove',e=>{ if(dragging) applyPct(pct(e.clientX)); });
  window.addEventListener('mouseup',()=>{ if(dragging){dragging=false;divider.classList.remove('drag');setTimeout(relayout,70);} });
  divider.addEventListener('touchstart',e=>{dragging=true;divider.classList.add('drag');},{passive:true});
  window.addEventListener('touchmove',e=>{ if(dragging){e.preventDefault();applyPct(pct(e.touches[0].clientX));} },{passive:false});
  window.addEventListener('touchend',()=>{ if(dragging){dragging=false;divider.classList.remove('drag');setTimeout(relayout,70);} });
  window.addEventListener('resize',()=>setTimeout(relayout,60));

  const sp=parseFloat(LS.get('abSplit')); if(sp>=22&&sp<=78) hudPane.style.flex='0 0 '+sp+'%';
  setMode(LS.get('abMode')||'split');
  setTimeout(relayout,300); setTimeout(relayout,900); setTimeout(relayout,1800);
})();
</script>
<script>
/* ===== AutoBoard: buscador plegable, ajustes, redimensionado del mapa ===== */
(function(){
  const $=id=>document.getElementById(id);
  const mapPane=$('mapPane');

  // --- Lupa que abre/cierra el buscador ---
  const sb=$('searchBar');
  if(sb){
    const tog=document.createElement('button'); tog.id='searchToggle'; tog.textContent='🔍'; tog.title='Buscar dirección';
    mapPane.appendChild(tog);
    sb.style.display='none'; // arrancar plegado
    function isOpen(){ return getComputedStyle(sb).display!=='none'; }
    tog.onclick=()=>{ if(isOpen()){ sb.style.display='none'; } else { sb.style.display='flex'; const d=$('dest'); if(d){ d.focus(); } } };
    // mantener el icono en sintonía con el estado real (se cierra solo al elegir destino)
    const sync=()=>{ tog.textContent=isOpen()?'✕':'🔍'; };
    try{ new MutationObserver(sync).observe(sb,{attributes:true,attributeFilter:['style']}); }catch(e){}
    sync();
  }

  // --- Botón "Actualizar mapa" dentro de Ajustes ---
  try{
    const sg=document.querySelector('#settings .sgrid');
    if(sg && !$('setRefresh')){
      const b=document.createElement('button'); b.id='setRefresh'; b.className='setbtn'; b.textContent='🔄 Actualizar';
      b.onclick=()=>{ const r=$('refresh'); if(r) r.click(); };
      sg.appendChild(b);
    }
  }catch(e){}

  // --- Satélite / Normal dentro de Ajustes ---
  try{
    const sg=document.querySelector('#settings .sgrid');
    if(sg && !$('setSat')){
      const b=document.createElement('button'); b.id='setSat'; b.className='setbtn';
      const upd=()=>{ const s=(typeof baseSat!=='undefined'&&baseSat); b.textContent=s?'🛰️ Satélite':'🗺️ Normal'; b.classList.toggle('on',s); };
      b.onclick=()=>{ if(typeof setBase==='function'){ setBase(!baseSat); if(typeof saveSettings==='function') saveSettings(); upd(); } };
      upd(); sg.insertBefore(b, sg.firstChild);
    }
  }catch(e){}

  // --- Indicaciones de ruta: sacarlas del panel del mapa para que se vean en cualquier modo ---
  const nav=$('navstack');
  if(nav){ document.getElementById('app').appendChild(nav); } // reparent al contenedor global
  function positionNav(){
    if(!nav) return;
    const solo=document.body.classList.contains('solo-hud')||document.body.classList.contains('solo-map')||document.body.classList.contains('faro');
    if(solo){ nav.style.left='50%'; nav.style.transform='translateX(-50%)'; }
    else { const c=mapPane.offsetLeft+mapPane.offsetWidth/2; nav.style.left=c+'px'; nav.style.transform='translateX(-50%)'; } // split -> centrado sobre el mapa (prioridad al mapa)
  }

  const app=document.getElementById('app');

  // --- Radares/aviso rojo a nivel global (visibles en HUD y mapa) ---
  ['radaredge','radarsign'].forEach(id=>{ const el=$(id); if(el) app.appendChild(el); });

  // --- Estilos de la barra inferior y del límite en mapa ---
  const st=document.createElement('style'); st.textContent=
    '#app{padding-bottom:74px;box-sizing:border-box;}'
   +'#dock{position:fixed;left:0;right:0;bottom:0;height:74px;display:flex;gap:8px;align-items:stretch;padding:8px 10px;background:#080b12;border-top:1px solid #1e2836;z-index:1000;box-sizing:border-box;}'
   +'#dock .wdg{background:#121824;border:1px solid #1e2836;border-radius:12px;padding:5px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;}'
   +'#dock .wdg.wide{flex:1;min-width:0;}'
   +'#dock .wv{font-size:19px;font-weight:800;color:#eef3fb;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}'
   +'#dock .wl{font-size:9px;letter-spacing:2px;color:#8b98ad;margin-top:3px;}'
   +'.trip{display:none!important;}'
   +'#limit2{display:none!important;}'                                   /* límite de vía ya no en el mapa: va al dock */
   +'.spd{display:none!important;}'                                      /* velocidad del HUD fuera: se usa la global */
   +'.spdmap{display:flex!important;top:12px!important;right:12px!important;left:auto!important;bottom:auto!important;z-index:720;padding:8px 20px!important;}'  /* velocidad del coche fija arriba-dcha en TODOS los modos */
   +'.spdmap b{font-size:42px!important;}'   /* velocímetro más grande */
   +'.spdmap small{font-size:11px!important;}'
   +'body.solo-map .spdmap{right:12px!important;}'                        /* anula la regla vieja que la desplazaba */
   +'#searchToggle{right:150px!important;}'                               /* lupa despejada de la velocidad, aun al maximizar */
   +'.gear,.recenter,#rain{display:none!important;}'
   +'.radarsign{opacity:.6;}'
   +'.radarsign.show{animation:radblink 1.05s ease-in-out infinite;}'
   +'@keyframes radblink{0%,100%{opacity:.12}50%{opacity:.72}}'
   +'#dkLimitWrap{min-width:auto;padding:2px 8px;}'
   +'#dkLimit{width:54px;height:54px;border-radius:50%;background:#fff;border:6px solid #e01d1d;display:flex;align-items:center;justify-content:center;font:800 25px system-ui;color:#111;}'
   +'#dkLimit.none{border-color:#3a4658;color:#8b98ad;background:#0e131d;}'
   +'#dock .dbtn{background:#121824;border:1px solid #1e2836;border-radius:12px;min-width:58px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#eef3fb;cursor:pointer;}'
   +'#dock .dbtn:active{transform:scale(.94);}'
   +'#dock .dbtn.on{border-color:#22d3ee;color:#22d3ee;}';
  document.head.appendChild(st);

  // --- Barra inferior: hora, llegada + accesos (centrar, actualizar, satélite, ajustes) ---
  const dock=document.createElement('div'); dock.id='dock';
  dock.innerHTML='<div class="wdg"><div class="wv" id="dkClock">--:--</div><div class="wl">HORA</div></div>'
    +'<div class="wdg" id="dkLimitWrap"><div class="lim none" id="dkLimit">--</div></div>'
    +'<div class="wdg wide"><div class="wv" id="dkEta">Sin ruta</div><div class="wl">LLEGADA</div></div>'
    +'<button class="dbtn" id="dCenter" title="Centrar flecha">🎯</button>'
    +'<button class="dbtn" id="dRefresh" title="Actualizar mapa">🔄</button>'
    +'<button class="dbtn" id="dSat" title="Satélite / Normal">🛰️</button>'
    +'<button class="dbtn" id="dGear" title="Ajustes">⚙️</button>';
  app.appendChild(dock);

  // ---------- Hoja inferior de cargador (tipo EVMap): tocar = resumen, deslizar = fotos + precios + datos ----------
  (function(){
    const cs=document.createElement('style'); cs.textContent=
      '#csheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;background:#0e131d;border-top:1px solid #263244;border-radius:16px 16px 0 0;transform:translateY(101%);transition:transform .25s ease,height .25s ease;height:172px;box-shadow:0 -10px 34px rgba(0,0,0,.55);display:flex;flex-direction:column;color:#eef3fb;}'
     +'#csheet.open{transform:translateY(0);} #csheet.expanded{height:80vh;}'
     +'#csheet .cs-grab{padding:8px 0 4px;display:flex;justify-content:center;cursor:grab;touch-action:none;}'
     +'#csheet .cs-grab span{width:44px;height:5px;border-radius:3px;background:#3a4658;}'
     +'#csheet .cs-head{display:flex;align-items:flex-start;gap:8px;padding:0 16px;}'
     +'#csheet .cs-title{font-size:18px;font-weight:800;flex:1;line-height:1.15;}'
     +'#csheet .cs-x{background:#1b2130;border:1px solid #263244;color:#c3ccda;border-radius:10px;width:32px;height:32px;font-size:15px;cursor:pointer;flex:0 0 auto;}'
     +'#csheet .cs-sum{padding:4px 16px 0;color:#9fb0c6;font-size:13px;line-height:1.4;}'
     +'#csheet .cs-btns{display:flex;gap:8px;padding:12px 16px;}'
     +'#csheet .cs-btns button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;}'
     +'#csheet #csGo{background:#38f5a0;color:#04130c;} #csheet #csAdd{background:#4c8dff;color:#fff;} #csheet #csFav{background:#2a3242;color:#fff;}'
     +'#csheet .cs-body{overflow-y:auto;padding:0 16px 20px;display:none;-webkit-overflow-scrolling:touch;}'
     +'#csheet.expanded .cs-body{display:block;}'
     +'#csheet .cs-photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;}'
     +'#csheet .cs-photos img{height:130px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#1b2130;}'
     +'#csheet .cs-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #1b2534;font-size:14px;}'
     +'#csheet .cs-row .k{color:#8b98ad;} #csheet .cs-conn{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #1b2534;font-size:14px;}'
     +'#csheet .cs-conn .kw{color:#38f5a0;font-weight:700;} #csheet h5{margin:14px 0 2px;font-size:12px;letter-spacing:1px;color:#8b98ad;text-transform:uppercase;}';
    document.head.appendChild(cs);
    const sheet=document.createElement('div'); sheet.id='csheet';
    sheet.innerHTML='<div class="cs-grab" id="csGrab"><span></span></div>'
      +'<div class="cs-head"><div class="cs-title" id="csTitle"></div><button class="cs-x" id="csX">✕</button></div>'
      +'<div class="cs-sum" id="csSum"></div>'
      +'<div class="cs-btns"><button id="csGo">Ir</button><button id="csAdd">Añadir parada</button><button id="csFav">⭐ Guardar</button></div>'
      +'<div class="cs-body" id="csBody"></div>';
    app.appendChild(sheet);
    let cur=null;
    function esc(s){ return (s==null?'':(''+s)).replace(/[<>&]/g,x=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[x])); }
    function expand(on){ sheet.classList.toggle('expanded',on); }
    function close(){ sheet.classList.remove('open','expanded'); cur=null; }
    window.openChargerSheet=function(p){ cur=p;
      $('csTitle').textContent=p.name||'Punto de carga';
      const sum=[]; if(p.op)sum.push(p.op); if(p.kw)sum.push('⚡ '+p.kw+' kW'); if(p.socks&&p.socks.length)sum.push(p.socks.slice(0,3).join(', ')); if(p.pts)sum.push(p.pts+' plazas');
      $('csSum').textContent=sum.join('  ·  ')||'Sin datos';
      // cuerpo (fotos + detalle)
      let h='';
      if(p.photos&&p.photos.length){ h+='<div class="cs-photos">'+p.photos.map(u=>'<img src="'+esc(u)+'" loading="lazy" onerror="this.style.display=\'none\'">').join('')+'</div>'; }
      if(p.cost){ h+='<div class="cs-row"><span class="k">Precio</span><span>'+esc(p.cost)+'</span></div>'; }
      if(p.usage){ h+='<div class="cs-row"><span class="k">Acceso</span><span>'+esc(p.usage)+'</span></div>'; }
      if(p.addr){ h+='<div class="cs-row"><span class="k">Dirección</span><span style="text-align:right">'+esc(p.addr)+'</span></div>'; }
      if(p.tel){ h+='<div class="cs-row"><span class="k">Teléfono</span><span><a href="tel:'+esc(p.tel)+'" style="color:#4c8dff">'+esc(p.tel)+'</a></span></div>'; }
      if(p.conns&&p.conns.length){ h+='<h5>Conectores</h5>'+p.conns.map(c=>'<div class="cs-conn"><span>'+esc(c.t)+(c.n>1?' ×'+c.n:'')+(c.st?' · '+esc(c.st):'')+'</span><span class="kw">'+(c.kw?c.kw+' kW':'')+'</span></div>').join(''); }
      if(p.url){ h+='<div class="cs-row"><span class="k">Web</span><span><a href="'+esc(p.url)+'" target="_blank" style="color:#4c8dff">abrir</a></span></div>'; }
      if(!h) h='<div class="cs-row"><span class="k">Sin datos adicionales</span><span></span></div>';
      $('csBody').innerHTML=h;
      sheet.classList.add('open'); expand(false);
    };
    $('csX').onclick=close;
    $('csGo').onclick=()=>{ if(cur){ close(); routeTo(cur.ll); } };
    $('csAdd').onclick=()=>{ if(cur){ close(); if(typeof addWaypoint==='function') addWaypoint(cur.ll); } };
    $('csFav').onclick=()=>{ if(cur&&typeof saveFav==='function'){ saveFav(cur.name||'Cargador',cur.ll[0],cur.ll[1]); } };
    // deslizar el asa: arriba = expandir, abajo = colapsar/cerrar
    let sy=0, dragging=false;
    const g=$('csGrab');
    const down=y=>{dragging=true; sy=y;}; const move=y=>{ if(!dragging)return; const dy=y-sy; if(dy<-30){ expand(true); dragging=false; } else if(dy>30){ if(sheet.classList.contains('expanded')){ expand(false); } else { close(); } dragging=false; } };
    g.addEventListener('touchstart',e=>down(e.touches[0].clientY),{passive:true});
    g.addEventListener('touchmove',e=>move(e.touches[0].clientY),{passive:true});
    g.addEventListener('touchend',()=>{dragging=false;});
    g.addEventListener('click',()=>expand(!sheet.classList.contains('expanded')));
    g.addEventListener('mousedown',e=>down(e.clientY)); window.addEventListener('mousemove',e=>move(e.clientY)); window.addEventListener('mouseup',()=>dragging=false);
  })();

  $('dCenter').onclick=()=>{ const r=$('recenter'); if(r) r.click(); };
  $('dRefresh').onclick=()=>{ const r=$('refresh'); if(r) r.click(); };
  $('dSat').onclick=()=>{ try{ if(typeof setBase==='function'){ setBase(!baseSat); if(typeof saveSettings==='function') saveSettings(); } $('dSat').classList.toggle('on', !!baseSat); const s=$('setSat'); if(s&&s.textContent!==undefined){ s.textContent=baseSat?'🛰️ Satélite':'🗺️ Normal'; s.classList.toggle('on',!!baseSat); } }catch(e){} };
  $('dGear').onclick=()=>{ try{ $('settings').classList.toggle('open'); }catch(e){} };
  try{ if(typeof baseSat!=='undefined') $('dSat').classList.toggle('on',!!baseSat); }catch(e){}

  function tickClock(){ try{ $('dkClock').textContent=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }catch(e){} }
  tickClock(); setInterval(tickClock,15000);

  // --- Modo FARO: HUD limpio para el móvil en soporte (mismo motor que v2) ---
  (function(){
    const st2=document.createElement('style'); st2.textContent=
      'body.faro #hudPane,body.faro #mapPane,body.faro #divider,body.faro #dock,body.faro .spdmap,body.faro #searchToggle,body.faro #limit2,body.faro #radaredge{display:none!important;}'
     +'body.faro{background:#000;}'
     +'#hudclean{position:fixed;inset:0;background:#000;z-index:400;display:none;}'
     +'body.faro #hudclean{display:block;}'
     +'#fSpeed{position:absolute;right:6vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;}'
     +'#fSpeed .n{font:800 40vh/0.82 system-ui;color:#fff;font-variant-numeric:tabular-nums;}'
     +'#fSpeed .u{font:700 5vh/1 system-ui;letter-spacing:5px;color:#cfd6e0;margin-top:1.2vh;}'
     +'#fSpeed.sign{width:52vh;height:52vh;border-radius:50%;background:#fff;border:5vh solid #e01d1d;}'
     +'#fSpeed.sign .n{color:#111;font-size:26vh;}'
     +'#fSpeed.sign .u{display:none;}'
     +'#fSpeed.sign.blink{filter:brightness(.5);}';   /* parpadeo por brillo -> respeta el color del aro por tipo */
    document.head.appendChild(st2);
    const hc=document.createElement('div'); hc.id='hudclean';
    hc.innerHTML='<div id="fSpeed"><div class="n" id="fNum">0</div><div class="u">KM/H</div></div>';
    app.appendChild(hc);
    let blink=false;
    setInterval(()=>{ blink=!blink; try{ const fs=document.getElementById('fSpeed'); if(fs&&fs.classList.contains('sign')) fs.classList.toggle('blink',blink); }catch(e){} }, 450); // parpadeo del borde
    setInterval(()=>{ try{
      const fs=document.getElementById('fSpeed'), fn=document.getElementById('fNum'); if(!fs) return;
      const r=(typeof hudRadar!=='undefined')?hudRadar:null;
      const spd=Math.round((typeof speedKmh!=='undefined')?speedKmh:0);
      if(r && r.active){ fs.classList.add('sign'); fn.textContent=spd; // TU velocidad dentro de la señal
        try{ fs.style.borderColor=window.radarColor?window.radarColor(r.type):'#e01d1d'; }catch(e){} }
      else { fs.classList.remove('sign','blink'); fs.style.borderColor=''; fn.textContent=spd; }
    }catch(e){} }, 200);
  })();

  // llegada: reflejar el texto de #trip en el dock (y ocultarla del mapa via CSS)
  setInterval(()=>{ try{ const t=$('trip'); const e=$('dkEta'); if(t&&e){ const txt=(t.textContent||'').trim(); e.textContent=txt||'Sin ruta'; } }catch(e){} },500);

  // --- Parking (Overpass): azul = de pago, verde = libre; toggle en Ajustes ---
  let parkOn=false, parkGroup=null, _parkAt=0, _parkPos=null;
  try{ if(typeof L!=='undefined'){ parkGroup=L.layerGroup(); } }catch(e){}
  try{
    const sg=document.querySelector('#settings .sgrid');
    if(sg && !$('setParking')){
      const b=document.createElement('button'); b.id='setParking'; b.className='setbtn'; b.textContent='🅿️ Parking';
      b.onclick=()=>{ parkOn=!parkOn; b.classList.toggle('on',parkOn); try{localStorage.setItem('abPark',parkOn?'1':'0');}catch(e){}
        if(parkOn){ if(parkGroup&&typeof map!=='undefined')parkGroup.addTo(map); loadParking(true); }
        else { if(parkGroup){ parkGroup.clearLayers(); if(typeof map!=='undefined'&&map.hasLayer(parkGroup))map.removeLayer(parkGroup);} } };
      try{ if(localStorage.getItem('abPark')==='1'){ parkOn=true; b.classList.add('on'); if(parkGroup&&typeof map!=='undefined')parkGroup.addTo(map); } }catch(e){}
      sg.appendChild(b);
    }
  }catch(e){}

  // --- Campo para la clave de GoingElectric (2ª fuente de cargadores) ---
  try{
    const st=$('settings');
    if(st && !$('geKeyIn')){
      const row=document.createElement('div'); row.className='srow';
      row.innerHTML='<span>Clave GoingElectric (cargadores)</span><div style="display:flex;gap:6px"><input id="geKeyIn" placeholder="pega tu key cuando la tengas" autocomplete="off" style="flex:1;background:#12161f;border:1px solid #263244;color:#eef3fb;border-radius:9px;padding:9px 10px;font-size:13px"><button class="setbtn" id="geKeySave" style="flex:0 0 auto">Guardar</button></div>';
      st.appendChild(row);
      try{ $('geKeyIn').value=localStorage.getItem('geKey')||''; }catch(e){}
      $('geKeySave').onclick=()=>{ try{ localStorage.setItem('geKey',$('geKeyIn').value.trim()); }catch(e){} try{ if($('status'))$('status').textContent='Clave GoingElectric guardada'; }catch(e){} try{ if(typeof disp!=='undefined'&&disp&&typeof fetchPois==='function') fetchPois([disp.lat,disp.lon]); }catch(e){} };
    }
  }catch(e){}

  async function loadParking(force){
    try{ if(!parkOn||typeof disp==='undefined'||!disp||!parkGroup) return;
      const now=Date.now(); if(!force && now-_parkAt<45000) return;
      if(!force && _parkPos && typeof dist==='function' && dist([disp.lat,disp.lon],_parkPos)<600) return;
      _parkAt=now; _parkPos=[disp.lat,disp.lon];
      const q='[out:json][timeout:15];(node[amenity=parking](around:2500,'+disp.lat+','+disp.lon+');way[amenity=parking](around:2500,'+disp.lat+','+disp.lon+'););out center 80;';
      let j=null;
      for(const ep of ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
        try{ const r=await fetch(ep,{method:'POST',body:q}); if(!r.ok)continue; j=await r.json(); break; }catch(e){}
      }
      if(!j||!j.elements) return; parkGroup.clearLayers();
      for(const el of j.elements){ const la=el.lat||(el.center&&el.center.lat), lo=el.lon||(el.center&&el.center.lon); if(la==null)continue;
        const tags=el.tags||{}; const fee=tags.fee||''; let col='#6b7686'; if(fee==='yes')col='#1c6ef2'; else if(fee==='no'||fee==='free')col='#1f9d4d';
        const ic=L.divIcon({className:'',html:'<div style="width:24px;height:24px;border-radius:4px;background:'+col+';border:2px solid #ffffff;box-shadow:0 1px 4px rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font:800 15px system-ui;color:#ffffff;">P</div>',iconSize:[24,24],iconAnchor:[12,12]});
        const mk=L.marker([la,lo],{icon:ic}); mk.addTo(parkGroup);
        mk.on('click',()=>parkingPopup(la,lo,tags));
        // pulsación larga -> ir a destino
        const eln=mk._icon;
        if(eln){ let t=null,moved=false;
          const start=()=>{ moved=false; t=setTimeout(()=>{ if(!moved && typeof routeTo==='function') routeTo([la,lo]); }, 550); };
          const cancel=()=>{ if(t){clearTimeout(t);t=null;} };
          eln.addEventListener('touchstart',start,{passive:true}); eln.addEventListener('touchmove',()=>{moved=true;cancel();},{passive:true}); eln.addEventListener('touchend',cancel);
          eln.addEventListener('mousedown',start); eln.addEventListener('mouseup',cancel); eln.addEventListener('mouseleave',cancel);
        }
      }
    }catch(e){}
  }
  function parkingPopup(la,lo,tags){
    try{
      tags=tags||{}; const fee=tags.fee||'';
      const parts=[ fee==='yes'?'💶 De pago':((fee==='no'||fee==='free')?'🟢 Gratuito':'Tarifa desconocida') ];
      if(tags.capacity) parts.push(tags.capacity+' plazas');
      if(tags.parking) parts.push(({surface:'superficie','multi-storey':'altura',underground:'subterráneo'})[tags.parking]||tags.parking);
      if(tags.access && tags.access!=='yes') parts.push('acceso: '+tags.access);
      if(tags.maxstay) parts.push('máx: '+tags.maxstay);
      if(tags.charge) parts.push(tags.charge);
      if(tags.operator) parts.push(tags.operator);
      const info=parts.join(' · '); const name=tags.name||'Parking';
      if(typeof openPopup==='function'){
        openPopup(la,lo,name,[
          {label:'Ir', fn:()=>{ if(typeof routeTo==='function') routeTo([la,lo]); }},
          (typeof routeOn!=='undefined'&&routeOn)?{label:'Añadir parada', fn:()=>{ if(typeof addWaypoint==='function') addWaypoint([la,lo]); }, bg:'#4c8dff', fg:'#fff'}:null,
          {label:'⭐ Guardar', fn:()=>{ if(typeof saveFav==='function') saveFav(name,la,lo); }, bg:'#2a3242', fg:'#fff'}
        ], info);
      }
    }catch(e){}
  }
  setInterval(()=>{ if(parkOn) loadParking(false); }, 20000); setTimeout(()=>{ if(parkOn) loadParking(true); }, 3000);

  // --- Velocidad del coche: badge global fijo arriba-derecha en todos los modos ---
  try{ const sm=document.querySelector('.spdmap'); if(sm) app.appendChild(sm); }catch(e){}

  // --- Límite de la vía: señal fija en el dock (espejo de #limit) ---
  setInterval(()=>{ try{ const L=$('limit'), d=$('dkLimit'); if(!d) return; const n=$('limitn'); const has=L && getComputedStyle(L).display!=='none' && n && n.textContent && n.textContent!=='--';
    if(has){ d.textContent=n.textContent; d.classList.remove('none'); } else { d.textContent='--'; d.classList.add('none'); } }catch(e){} },400);

  // --- Tamaño del mapa: plano = llena el panel (pocas teselas, fiable); inclinado = cuadrado diagonal ---
  function sizeMapSquare(){ /* v2: MapLibre llena el panel y gira en GPU; no hace falta cuadrado */ }

  // --- Redimensionado del mapa; un solo recálculo al terminar (sin machacar las teselas) ---
  let _mt=null;
  function fixMap(){ try{ sizeMapSquare(); if(typeof map!=='undefined'&&map){ map.invalidateSize(false); } }catch(e){} }
  function onLayout(){ sizeMapSquare(); positionNav(); clearTimeout(_mt); _mt=setTimeout(fixMap,220); }
  try{ if(window.ResizeObserver&&mapPane){ new ResizeObserver(onLayout).observe(mapPane); } }catch(e){}
  try{ new MutationObserver(()=>onLayout()).observe(document.body,{attributes:true,attributeFilter:['class']}); }catch(e){}
  window.addEventListener('resize',onLayout);

  // --- Mientras el usuario toca, pausar la cámara (fluidez + clic en marcadores). Captura para que funcione aun sobre marcadores. ---
  try{
    const down=()=>{ window.__uTouch=true; }, up=()=>{ setTimeout(()=>{ window.__uTouch=false; },70); };
    window.addEventListener('pointerdown',down,{capture:true,passive:true});
    window.addEventListener('pointerup',up,{capture:true,passive:true});
    window.addEventListener('pointercancel',up,{capture:true,passive:true});
    window.addEventListener('touchstart',down,{capture:true,passive:true});
    window.addEventListener('touchend',up,{capture:true,passive:true});
    window.addEventListener('touchcancel',up,{capture:true,passive:true});
  }catch(e){}

  // --- Pulsación larga en cualquier punto del mapa -> "Ir aquí" (táctil) ---
  try{
    const cont = map.raw.getCanvasContainer();
    let lpT=null, moved=false, sx=0, sy=0;
    const clear=()=>{ if(lpT){clearTimeout(lpT);lpT=null;} };
    cont.addEventListener('touchstart',e=>{ if(!e.touches||e.touches.length!==1){clear();return;} moved=false; const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
      clear(); lpT=setTimeout(()=>{ if(moved)return; try{ const r=cont.getBoundingClientRect(); const ll=map.raw.unproject([sx-r.left,sy-r.top]); if(typeof showGoHere==='function') showGoHere(ll.lat,ll.lng); }catch(e){} }, 550);
    },{passive:true});
    cont.addEventListener('touchmove',e=>{ const t=e.touches&&e.touches[0]; if(t&&(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10)){ moved=true; clear(); } },{passive:true});
    cont.addEventListener('touchend',clear,{passive:true});
    cont.addEventListener('touchcancel',clear,{passive:true});
  }catch(e){}
  try{ const t=$('setTilt'); if(t) t.addEventListener('click',()=>setTimeout(onLayout,60)); }catch(e){} // al cambiar inclinación, re-dimensiona el mapa
  setTimeout(()=>{ sizeMapSquare(); positionNav(); fixMap(); },600);
})();
</script>

<script type="module" src="./hud2-boot.js"></script>
<script>
/* ---- HUD 2: configuracion inicial ---------------------------------------
   Se pinta dentro de #hudroad (un solo lienzo, un solo bucle) y se apaga su
   superposicion propia: la velocidad, la maniobra y el radar los siguen
   mostrando #spdHud, #navstack y #radarsign, que ya funcionan.            */
(function(){
  function init(){
    if(!window.hud2){ setTimeout(init,300); return; }
    // ajustar() toca la configuracion del arranque (y la guarda); set() solo el motor
    const cfg={ incrustado:true, destino:'#hudroad',
                hud:false,           // sin panel de texto: el cartel del mapa manda
                carteles:true,       // SI los paneles azules/blancos dentro de la escena
                abrirAlNavegar:false,
                escala:0.6,          // resolucion de render: se ajusta desde Ajustes
                correccion:0.6, zonaMuerta:10,   // suavidad por encima de exactitud
                giroMax:35, vista:1.25,          // camara algo mas lejos y lenta
                estilo:'suave', radioMin:130 };  // trazado interpretado, no calcado
    if(typeof hud2.ajustar==='function') hud2.ajustar(cfg); else hud2.set(cfg);
    if(typeof radarDB!=='undefined' && radarDB && radarDB.length) hud2.radares(radarDB);
    if(typeof hudOn!=='undefined' && hudOn) hud2.abrir();

    // Salirse de la ruta y seguir mostrandola era lo que volvia loca la escena:
    // la distancia crecia hacia atras y la geometria daba saltos. Ahora el HUD 2
    // avisa y se pide recalculo con la funcion de ruta que ya tiene la app.
    // Ademas del aviso del HUD, un vigilante propio: si la distancia al trazado
    // crece durante varios segundos seguidos, se recalcula aunque el HUD calle.
    setInterval(function(){
      try{
        if(typeof routeOn==='undefined' || !routeOn || !disp || !routeCoordsLL) return;
        let mejor=Infinity;
        for(let i=0;i<routeCoordsLL.length;i+=4){
          const d=dist([disp.lat,disp.lon], routeCoordsLL[i]);
          if(d<mejor) mejor=d;
        }
        if(mejor>70 && Date.now()-(window.__hud2Recalc||0)>8000){
          window.__hud2Recalc=Date.now();
          $('status').textContent='Fuera de ruta ('+Math.round(mejor)+' m) · recalculando…';
          if(typeof destLL!=='undefined' && destLL) routeTo(destLL);
        }
      }catch(e){}
    }, 4000);

    hud2.onFueraDeRuta = function(desvio){
      console.warn('[hud2] fuera de ruta:', Math.round(desvio), 'm');
      try{
        if(typeof routeOn!=='undefined' && routeOn && typeof destLL!=='undefined' && destLL){
          if(Date.now()-(window.__hud2Recalc||0) > 8000){    // reintento cada 8 s
            window.__hud2Recalc=Date.now();
            $('status').textContent='Fuera de ruta · recalculando…';
            routeTo(destLL);
          }
        }
      }catch(e){ console.warn('[hud2] recalculo:', e.message); }
    };
  }
  init();
})();
</script>
