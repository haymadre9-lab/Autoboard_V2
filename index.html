<script>
/* Registro del service worker: cache con nombre propio ("autoboard"), se
   borran los caches con nombre ajeno, se pide actualizacion al SW y, si entra
   uno nuevo, se recarga una sola vez. Asi deja de servir versiones viejas.
   Extraido literal del index.html anterior -- sin esto, sw.js nunca llega a
   registrarse y la app no funciona sin conexion. */
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  let _r=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_r)return; _r=true; location.reload(); });
}
(function(){
  const MIO = 'autoboard';          // los caches que NO empiecen asi, se borran
  if(!('serviceWorker' in navigator)) return;
  addEventListener('load', async () => {
    try{
      if(window.caches){
        const ns = await caches.keys();
        for(const n of ns) if(n.indexOf(MIO)!==0){ await caches.delete(n); console.log('[sw] cache ajeno borrado:', n); }
      }
      const rs = await navigator.serviceWorker.getRegistrations();
      for(const r of rs){
        r.update();
        r.addEventListener('updatefound', () => {
          const nuevo = r.installing;
          if(!nuevo) return;
          nuevo.addEventListener('statechange', () => {
            if(nuevo.state==='installed' && navigator.serviceWorker.controller
               && !sessionStorage.getItem('swRecargado')){
              sessionStorage.setItem('swRecargado','1');
              console.log('[sw] version nueva instalada; recargando');
              location.reload();
            }
          });
        });
      }
    }catch(e){ console.warn('[sw]', e.message); }
  });
})();
</script>
